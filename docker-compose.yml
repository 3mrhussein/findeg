
services:
  postgres:
    image: postgres:16-alpine
    container_name: findeg-dev-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: findeg_user
      POSTGRES_PASSWORD: findeg_dev_password
      POSTGRES_DB: findeg_dev
    volumes:
      - findeg-postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findeg_user -d findeg_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  findeg-postgres-data:
    driver: local
