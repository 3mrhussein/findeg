name: Frontend Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: findeg_ci
        options: >-
          --health-cmd "pg_isready -U ci -d findeg_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/findeg_ci"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      NODE_ENV: "production"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack and prepare pnpm
        run: corepack enable && corepack prepare pnpm@8.8.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ~/.cache/pnpm
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm --filter @findeg/db run db:migrate

      - name: Seed database
        run: pnpm --filter @findeg/db run db:seed

      - name: Type check
        run: pnpm -w -r --if-present run type-check

      - name: Lint
        run: pnpm -w -r --if-present run lint

      - name: Build
        run: pnpm -w -r --if-present run build

      - name: Run E2E (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: pnpm -w -r --if-present run e2e:run:ci
