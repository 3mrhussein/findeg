name: Frontend Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Enable corepack and prepare pnpm
        run: corepack enable && corepack prepare pnpm@8.8.0 --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ~/.cache/pnpm
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm -w -r --if-present run type-check

      - name: Lint
        run: pnpm -w -r --if-present run lint

      - name: Build
        run: pnpm -w -r --if-present run build

      - name: Run E2E (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: pnpm -w -r --if-present run e2e:run:ci
