name: Backend Package Validation

on:
  # No `paths` filter on pull requests: these jobs are required status checks, and a workflow
  # that never runs never reports, which blocks docs-only PRs forever. The `changes` job below
  # skips the real jobs instead, and a skipped job reports success.
  pull_request:
  push:
    branches:
      - main
      - 001-separate-admin-project
    paths:
      - 'backend/**'
      - 'db/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # The PR merge commit and its base parent

      - name: Filter changed paths
        id: filter
        shell: bash
        run: |
          # Pushes are already path-filtered by the trigger.
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            echo 'backend=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The checked-out PR merge commit's first parent is the base branch tip.
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(backend/|db/|packages/env/|pnpm-lock\.yaml$|\.github/workflows/backend-validation\.yml$)'; then
            echo 'backend=true' >> "$GITHUB_OUTPUT"
          else
            echo 'backend=false' >> "$GITHUB_OUTPUT"
            echo 'No backend changes: validation and integration jobs are skipped.'
          fi

  validate-backend:
    name: Validate Backend Package
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for version comparison

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend tests
        run: pnpm --filter @findeg/backend test

      - name: Type check backend
        run: pnpm --filter @findeg/backend type-check

      - name: Validate exports - Dashboard
        run: pnpm --filter @findeg/dashboard type-check
        continue-on-error: false

      - name: Validate exports - Storefront
        run: pnpm --filter @findeg/storefront type-check
        continue-on-error: false

      - name: Check for breaking changes
        if: github.event_name == 'pull_request'
        run: |
          echo "🔍 Checking for breaking changes in backend package exports..."

          # Get the backend package version
          CURRENT_VERSION=$(node -p "require('./backend/package.json').version")
          echo "Current backend version: $CURRENT_VERSION"

          # Check if version was bumped in this PR
          git fetch origin ${{ github.base_ref }}
          BASE_VERSION=$(git show origin/${{ github.base_ref }}:backend/package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8')).version" || echo "0.0.0")
          echo "Base backend version: $BASE_VERSION"

          if [ "$CURRENT_VERSION" == "$BASE_VERSION" ]; then
            echo "⚠️ Warning: Backend package version unchanged"
            echo "If this PR contains breaking changes to backend exports, please bump the version:"
            echo "  - Patch (0.1.0 → 0.1.1): Bug fixes, no breaking changes"
            echo "  - Minor (0.1.0 → 0.2.0): New features, no breaking changes"
            echo "  - Major (0.1.0 → 1.0.0): Breaking changes to public API"
            echo ""
            echo "::warning file=backend/package.json::Backend version unchanged. Consider bumping if breaking changes exist."
          else
            echo "✅ Backend version bumped: $BASE_VERSION → $CURRENT_VERSION"
          fi

      - name: Summary
        if: success()
        run: |
          echo "✅ Backend package validation passed!"
          echo "- All backend tests pass"
          echo "- Dashboard can import backend exports"
          echo "- Storefront can import backend exports"
          echo "- No TypeScript errors in cross-package imports"

  integration-tests:
    name: Backend Integration Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: findeg
          POSTGRES_PASSWORD: findeg
          POSTGRES_DB: findeg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U findeg -d findeg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      INTEGRATION_DATABASE_URL: postgres://findeg:findeg@localhost:5432/findeg

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend integration tests
        run: pnpm test:integration
