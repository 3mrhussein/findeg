name: Backend Package Validation

on:
  pull_request:
    paths:
      - 'packages/backend/**'
      - 'pnpm-lock.yaml'
  push:
    branches:
      - main
      - 001-separate-admin-project
    paths:
      - 'packages/backend/**'

jobs:
  validate-backend:
    name: Validate Backend Package
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for version comparison

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend package
        run: pnpm --filter @findeg/backend build

      - name: Run backend tests
        run: pnpm --filter @findeg/backend test --run

      - name: Type check backend
        run: pnpm --filter @findeg/backend type-check

      - name: Validate exports - Dashboard
        run: pnpm --filter @findeg/dashboard type-check
        continue-on-error: false

      - name: Validate exports - Storefront
        run: pnpm --filter @findeg/storefront type-check
        continue-on-error: false

      - name: Check for breaking changes
        if: github.event_name == 'pull_request'
        run: |
          echo "🔍 Checking for breaking changes in backend package exports..."
          
          # Get the backend package version
          CURRENT_VERSION=$(node -p "require('./packages/backend/package.json').version")
          echo "Current backend version: $CURRENT_VERSION"
          
          # Check if version was bumped in this PR
          git fetch origin ${{ github.base_ref }}
          BASE_VERSION=$(git show origin/${{ github.base_ref }}:packages/backend/package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8')).version" || echo "0.0.0")
          echo "Base backend version: $BASE_VERSION"
          
          if [ "$CURRENT_VERSION" == "$BASE_VERSION" ]; then
            echo "⚠️ Warning: Backend package version unchanged"
            echo "If this PR contains breaking changes to backend exports, please bump the version:"
            echo "  - Patch (0.1.0 → 0.1.1): Bug fixes, no breaking changes"
            echo "  - Minor (0.1.0 → 0.2.0): New features, no breaking changes"
            echo "  - Major (0.1.0 → 1.0.0): Breaking changes to public API"
            echo ""
            echo "::warning file=packages/backend/package.json::Backend version unchanged. Consider bumping if breaking changes exist."
          else
            echo "✅ Backend version bumped: $BASE_VERSION → $CURRENT_VERSION"
          fi

      - name: Run export verification tests
        run: pnpm --filter @findeg/backend test --run src/__tests__/exports.test.ts

      - name: Summary
        if: success()
        run: |
          echo "✅ Backend package validation passed!"
          echo "- Backend builds successfully"
          echo "- All backend tests pass"
          echo "- Dashboard can import backend exports"
          echo "- Storefront can import backend exports"
          echo "- No TypeScript errors in cross-package imports"
