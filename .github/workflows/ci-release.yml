name: CI · Release

# Guards develop → main PRs and pushes (the strict tier).
# Every job runs from scratch: Turbo --force, no cache restore/save,
# integration tests always, E2E required. Jobs live in ci-jobs.yml.
# Required check: `Strict / CI OK`.
# No secrets are passed: the jobs use none (GITHUB_TOKEN reaches them anyway).
on:
  pull_request:
    branches: [main]
    # A base-branch edit must start CI for the newly selected tier.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  strict:
    name: Strict
    uses: ./.github/workflows/ci-jobs.yml
    with:
      tier: strict
