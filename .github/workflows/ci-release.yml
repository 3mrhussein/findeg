name: CI · Release

# Guards PRs targeting main and pushes to main and develop. main is the strict
# tier: every job from scratch (Turbo --force, no cache restore, integration
# tests always, E2E required). A develop push that merges a PR runs the fast
# tier (touched packages, caches restored); a direct push to develop (no merged
# PR, e.g. a hotfix) runs strict. Every develop push saves the caches the
# feature PRs restore. Jobs live in ci-jobs.yml.
# Required check on PRs into main: `Strict / CI OK`.
# The only secret passed is the optional SLACK_WEBHOOK_URL, for the run-result card
# after pushes to main and develop (GITHUB_TOKEN reaches the jobs anyway).
on:
  pull_request:
    branches: [main]
    # A base-branch edit must start CI for the newly selected tier.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  strict:
    name: Strict
    # A called workflow can only narrow its caller's token, so the opt-in
    # `Publish evidence` job (ci-jobs.yml) needs write here. ci-jobs.yml sets
    # `contents: read` for every other job; PRs from forks still get a read token.
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/ci-jobs.yml
    with:
      # A develop push runs either tier (fast when it merges a PR), so the policy decides.
      tier: ${{ github.event_name == 'push' && github.ref_name == 'develop' && 'any' || 'strict' }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
