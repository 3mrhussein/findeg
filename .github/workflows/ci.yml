name: CI · Feature

# Guards feature → develop PRs (the fast tier).
# Affected packages only, caches restored, integration tests only on relevant
# changes, no E2E. Jobs live in ci-jobs.yml.
# Required check: `Feature / CI OK`.
# Run workflow (manual): like a PR into develop (touched packages only, caches
# restored) on the chosen branch; the checkboxes opt out of the cache and/or
# run the full test suite.
# Pushes to develop and everything into main run CI · Release (ci-release.yml).
# No secrets are passed: the jobs use none (GITHUB_TOKEN reaches them anyway).
on:
  pull_request:
    branches: [develop]
    # A base-branch edit must start CI for the newly selected tier.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      no_cache:
        description: Force disable cache (fresh build)
        type: boolean
        default: false
      full_tests:
        description: Force run full tests (default runs touched files only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  feature:
    name: Feature
    # GitHub checks nested jobs' permissions against the caller when it loads the
    # workflow, so this must allow what ci-jobs.yml's `Publish evidence` asks for
    # (write). That job only runs after a strict-tier E2E failure, never on this
    # tier, and ci-jobs.yml keeps every other job at `contents: read`.
    permissions:
      contents: write
    uses: ./.github/workflows/ci-jobs.yml
    with:
      tier: fast # policy tier stays "fast"; only the display name changes
      force_build: ${{ inputs.no_cache || false }}
      force_install: ${{ inputs.no_cache || false }}
      full_tests: ${{ inputs.full_tests || false }}
