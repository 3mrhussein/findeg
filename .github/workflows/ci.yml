name: CI · Feature

# Guards feature → develop PRs and pushes (the fast tier).
# Affected packages only, caches restored, integration tests only on relevant
# changes, no E2E. Jobs live in ci-jobs.yml.
# Required check: `Feature / CI OK`.
# PRs into main run CI · Release (ci-release.yml) instead.
# No secrets are passed: the jobs use none (GITHUB_TOKEN reaches them anyway).
on:
  pull_request:
    branches: [develop]
    # A base-branch edit must start CI for the newly selected tier.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  feature:
    name: Feature
    uses: ./.github/workflows/ci-jobs.yml
    with:
      tier: fast # policy tier stays "fast"; only the display name changes
