name: CI · Feature

# Guards feature → develop PRs (the fast tier).
# Affected packages only, caches restored, integration tests only on relevant
# changes, no E2E. Jobs live in ci-jobs.yml.
# Required check: `Feature / CI OK`.
# Run workflow (manual): every code job on the chosen branch, caches restored
# unless the checkboxes ask to ignore them.
# Pushes to develop and everything into main run CI · Release (ci-release.yml).
# No secrets are passed: the jobs use none (GITHUB_TOKEN reaches them anyway).
on:
  pull_request:
    branches: [develop]
    # A base-branch edit must start CI for the newly selected tier.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      force_build:
        description: Force build job (ignore build cache)
        type: boolean
        default: false
      force_install:
        description: Force clean install (ignore pnpm store cache)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  feature:
    name: Feature
    uses: ./.github/workflows/ci-jobs.yml
    with:
      tier: fast # policy tier stays "fast"; only the display name changes
      force_build: ${{ inputs.force_build || false }}
      force_install: ${{ inputs.force_install || false }}
