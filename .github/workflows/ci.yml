name: CI

# The fast tier, for develop. The jobs live in ci-jobs.yml; the required check
# is `Fast / CI OK`. PRs into main run CI · Release (ci-release.yml) instead.
# No secrets are passed: the jobs use none (GITHUB_TOKEN reaches them anyway).
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    name: Fast
    uses: ./.github/workflows/ci-jobs.yml
    with:
      tier: fast
