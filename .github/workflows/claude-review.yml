# Has Claude Code review PRs that Codex opened, using the repo's code-review skill.
# Triggered manually via:
#  - "Run workflow" button in Actions tab (workflow_dispatch)
#  - Adding label `agent:codex` to the PR
#  - Automatically on PR open when repo variable AUTO_AGENT_REVIEW is 'true'
name: Claude review (Codex PRs)

on:
  pull_request:
    types: [opened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to review'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'agent:codex') ||
      (vars.AUTO_AGENT_REVIEW == 'true' &&
        (github.event.action == 'opened' || github.event.action == 'ready_for_review') &&
        !github.event.pull_request.draft &&
        contains(format(',{0},', vars.CODEX_PR_AUTHORS), format(',{0},', github.event.pull_request.user.login)))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR details
        id: pr_info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUM="${{ github.event.inputs.pr_number }}"
            BASE=$(gh pr view "$PR_NUM" --json baseRefName -q .baseRefName)
          else
            PR_NUM="${{ github.event.pull_request.number }}"
            BASE="${{ github.base_ref }}"
          fi
          echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT
          echo "base_ref=$BASE" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the skill diffs against the merge-base

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: ${{ vars.CODEX_PR_AUTHORS }}
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Skill,Bash(git diff:*),Bash(git log:*),Bash(git rev-parse:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
          prompt: |
            Review PR #${{ steps.pr_info.outputs.pr_number }} against base origin/${{ steps.pr_info.outputs.base_ref }}.

            Provide a clear, concise code review. Focus on:
            - Logic errors, potential bugs, edge cases, and race conditions
            - Breaking database or API contract changes

            If the code looks good and ready to merge, approve with a brief note.
            Keep feedback actionable and concise without unnecessary boilerplate.
            This run is non-interactive: never edit files or push.
            Post your review comment with `gh pr comment ${{ steps.pr_info.outputs.pr_number }} --body-file -`.
