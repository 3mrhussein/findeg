# Has Claude Code review PRs that Codex opened, using the repo's code-review skill.
# Codex labels its PRs `agent:codex` (see AGENTS.md); `gh pr create --label`
# fires a `labeled` event, so this runs once per PR.
name: Claude review (Codex PRs)

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    if: github.event.label.name == 'agent:codex'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the skill diffs against the merge-base

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Agent,Skill,Bash(git diff:*),Bash(git log:*),Bash(git rev-parse:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }} by following
            .claude/skills/code-review/SKILL.md exactly.

            - Fixed point: origin/${{ github.base_ref }}.
            - Spec: the issue(s) this PR closes. Find them with
              `gh pr view ${{ github.event.pull_request.number }} --json closingIssuesReferences`,
              then read each one with `gh issue view`. If none, skip the Spec axis and say "no spec available".
            - This run is non-interactive: never ask questions, and never edit files or push.
            - Post the final report (## Standards, ## Spec, one-line summary) as a single comment with
              `gh pr comment ${{ github.event.pull_request.number }} --body-file -`.
