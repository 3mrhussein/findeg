name: CI jobs

# Every CI job, defined once, behind one gate job: `CI OK`. Two workflows call
# it and hold only their triggers: CI · Feature (develop, caller job `Feature`,
# gate `Feature / CI OK`) and CI · Release (main, caller job `Strict`, gate
# `Strict / CI OK`). Every decision (tier, caches, which jobs run, the verdict)
# comes from .github/scripts; this file only wires its outputs to jobs.
#
# - strict tier (PRs into / pushes to main, pushes to develop): every job,
#   Turbo forced, E2E required, nothing restored. develop is pre-production,
#   so what is merged there is verified from scratch; its pushes are still the
#   single cache producer (they save, they never restore).
# - fast tier (PRs into develop): affected packages only, caches restored.
# - manual run (fast tier, `CI · Feature` → Run workflow): every code job on
#   all packages, caches restored unless the force options say otherwise.
#
# Every caller must grant at least the highest permission a job here asks for
# (`Publish evidence` needs `contents: write`), even a caller that never runs it:
# GitHub rejects the workflow file otherwise.
#
# The `github` context here is the caller's (its event, refs and SHAs).
# Concurrency is set by the callers only: here `github.workflow` would name
# the caller too, and a matching group would cancel or deadlock the caller.
on:
  workflow_call:
    inputs:
      tier:
        description: >-
          The tier the calling workflow runs, `fast` or `strict`. Plan fails when
          the policy picks a different tier for the event, so a mis-set trigger
          can't run the wrong tier.
        type: string
        required: true
      force_build:
        description: 'Manual runs only, ignore the build caches and force Turbo.'
        type: boolean
        default: false
      force_install:
        description: 'Manual runs only, ignore the pnpm store cache.'
        type: boolean
        default: false
    secrets:
      SLACK_WEBHOOK_URL:
        description: 'Slack incoming webhook for the run-result card. Optional, without it no card is posted.'
        required: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      turbo_flags: ${{ steps.plan.outputs.turbo_flags }}
      fetch_depth: ${{ steps.plan.outputs.fetch_depth }}
      restore_deps: ${{ steps.plan.outputs.restore_deps }}
      restore_build: ${{ steps.plan.outputs.restore_build }}
      save_cache: ${{ steps.plan.outputs.save_cache }}
      run_checks: ${{ steps.plan.outputs.run_checks }}
      run_integration: ${{ steps.plan.outputs.run_integration }}
      run_e2e: ${{ steps.plan.outputs.run_e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          sparse-checkout: |
            .github/scripts
            .github/config
      # A sparse checkout keeps the root files, so .nvmrc is there.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # A PR is checked out as its merge commit, whose first parent is the base
      # tip. A push is compared with the branch's previous tip. When that can't
      # be fetched (a new branch, a force-push), no list is written and the
      # plan runs every job.
      - name: List changed paths
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=HEAD^1
          if [ "$EVENT" = push ]; then
            base="$BEFORE"
            git fetch --quiet --depth=1 origin "$BEFORE" || base=
          fi
          if [ -n "$base" ] && git diff --name-only --no-renames "$base" HEAD > "$RUNNER_TEMP/changed-paths.txt"; then
            echo "file=$RUNNER_TEMP/changed-paths.txt" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/changed-paths.txt"
          fi

      # The policy's behaviour is pinned by its tests; a regression fails here
      # before the plan it would corrupt is used.
      - name: Test the CI policy
        run: node --test .github/scripts/*.test.mjs

      - name: Decide the CI plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ github.base_ref || github.ref_name }}
          HEAD: ${{ github.head_ref }}
          EXPECTED_TIER: ${{ inputs.tier }}
          CHANGED_FILES: ${{ steps.changes.outputs.file }}
          FORCE_BUILD: ${{ inputs.force_build }}
          FORCE_INSTALL: ${{ inputs.force_install }}
        run: |
          args=(--event "$EVENT" --target "$TARGET")
          if [ "$FORCE_BUILD" = true ]; then args+=(--force-build); fi
          if [ "$FORCE_INSTALL" = true ]; then args+=(--force-install); fi
          if [ -n "$HEAD" ]; then args+=(--head "$HEAD"); fi
          if [ -n "$EXPECTED_TIER" ]; then args+=(--expect-tier "$EXPECTED_TIER"); fi
          if [ -n "$CHANGED_FILES" ]; then args+=(--changed-files "$CHANGED_FILES"); fi
          node .github/scripts/ci-cli.mjs plan "${args[@]}"

  # The code checks share one shape: a full-history checkout on the fast tier
  # (Turbo's --affected diffs against the PR base or the previous push), the
  # shared setup, one Turbo task, then a cache save on producer runs. Lint,
  # Type check and Unit tests are one job, a leg per task; Build adds a
  # database. TURBO_FLAGS is split into an array: it may hold several flags.
  checks:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Lint, task: lint }
          - { name: Type check, task: type-check }
          - { name: Unit tests, task: test }
    env:
      TURBO_FLAGS: ${{ needs.plan.outputs.turbo_flags }}
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
      TASK: ${{ matrix.task }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ needs.plan.outputs.fetch_depth }}
      - uses: ./.github/actions/setup
        with:
          restore-deps: ${{ needs.plan.outputs.restore_deps }}
          restore-build: ${{ needs.plan.outputs.restore_build }}
          turbo-cache-key: ${{ matrix.task }}
      - name: Workspace package ${{ matrix.task }}
        run: |
          read -ra flags <<< "$TURBO_FLAGS"
          pnpm exec turbo run "$TASK" "${flags[@]}"
      # Only the Lint leg saves the pnpm store: every job installs the same
      # lockfile, and a lockfile change always runs the code checks.
      - if: needs.plan.outputs.save_cache == 'true'
        uses: ./.github/actions/save-cache
        with:
          pnpm-store: ${{ matrix.task == 'lint' }}

  # The Next.js builds prerender from the database, so Build needs a migrated,
  # seeded Postgres. Turbo's strict env mode strips job env from tasks, so the
  # database settings reach the build (and db:migrate/db:seed, which load
  # ../.env) through a root .env file.
  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: findeg_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d findeg_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TURBO_FLAGS: ${{ needs.plan.outputs.turbo_flags }}
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ needs.plan.outputs.fetch_depth }}
      - uses: ./.github/actions/setup
        with:
          restore-deps: ${{ needs.plan.outputs.restore_deps }}
          restore-build: ${{ needs.plan.outputs.restore_build }}
          turbo-cache-key: build
          next-cache: 'true'
      - name: Write root .env
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://ci:ci@localhost:5432/findeg_ci
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          NEXT_PUBLIC_SITE_URL=http://localhost:3000
          NODE_ENV=test
          EOF
      - name: Migrate and seed the database
        run: |
          pnpm --filter @findeg/db run db:migrate
          pnpm --filter @findeg/db run db:seed
      # --only: the Type check job already covers type-check, which build
      # otherwise depends on.
      - name: Workspace package build
        run: |
          read -ra flags <<< "$TURBO_FLAGS"
          pnpm exec turbo run build --only "${flags[@]}"
      - if: needs.plan.outputs.save_cache == 'true'
        uses: ./.github/actions/save-cache

  # The integration suite creates and migrates its own database on the
  # service; it needs no .env, migration or seed.
  integration:
    name: Integration tests
    needs: plan
    if: needs.plan.outputs.run_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: findeg
          POSTGRES_PASSWORD: findeg
          POSTGRES_DB: findeg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U findeg -d findeg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgres://findeg:findeg@localhost:5432/findeg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          restore-deps: ${{ needs.plan.outputs.restore_deps }}
          restore-build: ${{ needs.plan.outputs.restore_build }}
      - run: pnpm test:integration
      - if: needs.plan.outputs.save_cache == 'true'
        uses: ./.github/actions/save-cache

  # Strict E2E builds its own apps against a fresh database, without restoring
  # dependencies, Turbo, Next.js or Cypress caches.
  e2e:
    name: E2E
    needs: plan
    if: needs.plan.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      screenshot_mode: ${{ steps.report.outputs.screenshot_mode }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: findeg_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d findeg_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          restore-deps: 'false'
          restore-build: 'false'
      # pnpm's allowBuilds disables Cypress's postinstall.
      - name: Install Cypress binary
        run: pnpm --filter @findeg/storefront exec cypress install
      - name: Write root .env
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://ci:ci@localhost:5432/findeg_e2e
          DB_SSL=false
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          NEXT_PUBLIC_SITE_URL=http://localhost:3000
          NODE_ENV=production
          JWT_SECRET=ci-e2e-jwt-secret-at-least-32-characters
          JWT_REFRESH_SECRET=ci-e2e-refresh-secret-at-least-32-characters
          GUEST_ACCESS_SECRET=ci-e2e-guest-secret-at-least-32-characters
          EOF
      - name: Migrate and seed the database
        run: |
          pnpm --filter @findeg/db run db:migrate
          pnpm --filter @findeg/db run db:seed
      - name: Build storefront and dashboard from scratch
        run: >-
          pnpm exec turbo run build --only --cache=local:
          --filter=@findeg/storefront --filter=@findeg/dashboard
      - name: Start apps and wait for HTTP readiness
        run: |
          pnpm --filter @findeg/storefront start > "$RUNNER_TEMP/storefront.log" 2>&1 &
          pnpm --filter @findeg/dashboard start > "$RUNNER_TEMP/dashboard.log" 2>&1 &
          curl --fail --silent --show-error --location --retry 60 --retry-delay 2 --retry-all-errors --max-time 10 http://localhost:3000/en > /dev/null
          curl --fail --silent --show-error --location --retry 60 --retry-delay 2 --retry-all-errors --max-time 10 http://localhost:3001/en > /dev/null
      # Run E2E suites across all packages implementing the test:e2e contract.
      # Continue-on-error runs every suite to collect complete failure evidence;
      # tee keeps the output for the report (pipefail keeps the exit status).
      - name: Execute E2E test suites
        id: e2e
        continue-on-error: true
        shell: bash
        env:
          TEST_ARTIFACTS_DIR: ${{ runner.temp }}/artifacts
        run: pnpm test:e2e --continue 2>&1 | tee "$RUNNER_TEMP/e2e-output.txt"
      - name: Upload E2E failure evidence
        if: failure() || steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure-evidence
          path: |
            ${{ runner.temp }}/artifacts
            ${{ runner.temp }}/*.log
          if-no-files-found: warn
      # Always renders, even when the run crashed before writing any evidence.
      - name: Report E2E results
        id: report
        if: always()
        env:
          OUTCOME: ${{ steps.e2e.outcome || 'skipped' }}
          # Only pushes and manual runs may publish screenshots; PRs never get a write token.
          CAN_WRITE: ${{ github.event_name != 'pull_request' && 'true' || '' }}
        run: |
          args=(--outcome "$OUTCOME"
            --output-file "$RUNNER_TEMP/e2e-output.txt"
            --storefront-log "$RUNNER_TEMP/storefront.log"
            --dashboard-log "$RUNNER_TEMP/dashboard.log"
            --evidence-dir "$RUNNER_TEMP/artifacts"
            --artifact-name e2e-failure-evidence)
          if [ -n "$CAN_WRITE" ]; then args+=(--can-write); fi
          node .github/scripts/ci-e2e-cli.mjs report "${args[@]}"
      - name: Require E2E test suites to pass
        if: always()
        run: test "${{ steps.e2e.outcome }}" = success

  # Opt-in (screenshot_mode "pages" in .github/config/settings.json): publishes
  # failure screenshots to the ci-evidence branch, served by GitHub Pages, so the
  # E2E report can embed them. Its own job so the E2E job, which runs the
  # branch's code, never holds a write token.
  publish-evidence:
    name: Publish evidence
    needs: e2e
    if: always() && needs.e2e.outputs.screenshot_mode == 'pages' && needs.e2e.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: e2e-failure-evidence
          path: evidence
      - name: Publish screenshots and prune old runs
        env:
          RUN_ID: ${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          GH_TOKEN: ${{ github.token }}
          # Environment identity covers the `site` repo created below; `git config`
          # here would only set the checkout's.
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git clone --quiet --branch ci-evidence --single-branch \
            "https://x-access-token:${GH_TOKEN}@${REPO_URL#https://}" site 2>/dev/null \
            || { git init --quiet site && git -C site checkout --quiet --orphan ci-evidence \
              && git -C site remote add origin "https://x-access-token:${GH_TOKEN}@${REPO_URL#https://}"; }
          mkdir -p "site/runs/$RUN_ID"
          # The artifact holds runner.temp/artifacts, so copy from evidence/artifacts to
          # publish paths relative to it, matching the URLs the E2E report builds.
          if [ -d evidence/artifacts ]; then
            (cd evidence/artifacts && find . -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -print0 \
              | xargs -0 -I{} cp --parents {} "../../site/runs/$RUN_ID/")
          fi
          touch site/.nojekyll
          git -C site add -A
          git -C site commit --quiet -m "evidence: run $RUN_ID" || true
          if [ -d site/runs ]; then
            for path in site/runs/*/; do
              dir=$(basename "$path")
              echo "$dir $(git -C site log -1 --format=%ct -- "runs/$dir")"
            done | node .github/scripts/ci-e2e-cli.mjs prune | while read -r old; do
              git -C site rm -rq "runs/$old"
            done
            git -C site commit --quiet -m "evidence: prune old runs" || true
          fi
          git -C site push --quiet origin ci-evidence

  # The only check a ruleset needs to require. It always runs, so skipped jobs
  # can't leave it pending; the policy decides whether the results pass.
  ci-ok:
    name: CI OK
    needs: [plan, checks, build, integration, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Decide the verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
          TIER: ${{ needs.plan.outputs.tier }}
        run: node .github/scripts/ci-cli.mjs verdict --tier "$TIER" --needs "$NEEDS"

  # Posts the run-result card to Slack after a push to develop or main. The card
  # comes from .github/config/templates; without the webhook secret (forks, a
  # repo that hasn't set it up) the job skips quietly instead of failing.
  notify:
    name: Notify
    needs: [ci-ok]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      GATE_RESULT: ${{ needs.ci-ok.result }}
    steps:
      - name: Check for the Slack webhook
        id: webhook
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No SLACK_WEBHOOK_URL secret: skipping the Slack card."
          fi
      - if: steps.webhook.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
            .github/config
      - if: steps.webhook.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Post the run-result card
        if: steps.webhook.outputs.present == 'true'
        run: |
          status=failure
          [ "$GATE_RESULT" = success ] && status=success
          node .github/scripts/ci-report-cli.mjs render \
            --template run-result.slack.json --status "$status" --env > "$RUNNER_TEMP/card.json"
          curl --fail --silent --show-error --retry 3 --max-time 20 \
            -H 'Content-Type: application/json' \
            --data @"$RUNNER_TEMP/card.json" "$SLACK_WEBHOOK_URL"
