name: CI jobs

# Every CI job, defined once, behind one gate job: `CI OK`. Two workflows call
# it and hold only their triggers: CI (develop, caller job `Fast`, gate
# `Fast / CI OK`) and CI · Release (main, caller job `Strict`, gate
# `Strict / CI OK`). Every decision (tier, caches, which jobs run, the verdict)
# comes from scripts/ci-policy; this file only wires its outputs to jobs.
#
# - strict tier (PRs into / pushes to main): every job, Turbo forced, no caches.
# - fast tier (PRs into / pushes to develop): affected packages only, caches
#   restored; pushes to develop are the single cache producer.
#
# The `github` context here is the caller's (its event, refs and SHAs).
# Concurrency is set by the callers only: here `github.workflow` would name
# the caller too, and a matching group would cancel or deadlock the caller.
on:
  workflow_call:
    inputs:
      tier:
        description: >-
          The tier the calling workflow runs, `fast` or `strict`. Plan fails when
          the policy picks a different tier for the event, so a mis-set trigger
          can't run the wrong tier.
        type: string
        required: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      turbo_flags: ${{ steps.plan.outputs.turbo_flags }}
      fetch_depth: ${{ steps.plan.outputs.fetch_depth }}
      use_cache: ${{ steps.plan.outputs.use_cache }}
      save_cache: ${{ steps.plan.outputs.save_cache }}
      run_checks: ${{ steps.plan.outputs.run_checks }}
      run_integration: ${{ steps.plan.outputs.run_integration }}
      run_e2e: ${{ steps.plan.outputs.run_e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          sparse-checkout: scripts/ci-policy
      # A sparse checkout keeps the root files, so .nvmrc is there.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # A PR is checked out as its merge commit, whose first parent is the base
      # tip. A push is compared with the branch's previous tip. When that can't
      # be fetched (a new branch, a force-push), no list is written and the
      # plan runs every job.
      - name: List changed paths
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=HEAD^1
          if [ "$EVENT" = push ]; then
            base="$BEFORE"
            git fetch --quiet --depth=1 origin "$BEFORE" || base=
          fi
          if [ -n "$base" ] && git diff --name-only --no-renames "$base" HEAD > "$RUNNER_TEMP/changed-paths.txt"; then
            echo "file=$RUNNER_TEMP/changed-paths.txt" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/changed-paths.txt"
          fi

      - name: Decide the CI plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ github.base_ref || github.ref_name }}
          EXPECTED_TIER: ${{ inputs.tier }}
          CHANGED_FILES: ${{ steps.changes.outputs.file }}
        run: >-
          node scripts/ci-policy/cli.mjs plan --event "$EVENT" --target "$TARGET"
          --expect-tier "$EXPECTED_TIER"
          ${CHANGED_FILES:+--changed-files "$CHANGED_FILES"}

  # The code checks share one shape: a full-history checkout on the fast tier
  # (Turbo's --affected diffs against the PR base or the previous push), the
  # shared setup, one Turbo task, then a cache save on producer runs. Lint,
  # Type check and Unit tests are one job, a leg per task; Build adds a
  # database. TURBO_FLAGS is split into an array: it may hold several flags.
  checks:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Lint, task: lint }
          - { name: Type check, task: type-check }
          - { name: Unit tests, task: test }
    env:
      TURBO_FLAGS: ${{ needs.plan.outputs.turbo_flags }}
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
      TASK: ${{ matrix.task }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ needs.plan.outputs.fetch_depth }}
      - uses: ./.github/actions/setup
        with:
          cache: ${{ needs.plan.outputs.use_cache }}
          turbo-cache-key: ${{ matrix.task }}
      - name: Workspace package ${{ matrix.task }}
        run: |
          read -ra flags <<< "$TURBO_FLAGS"
          pnpm exec turbo run "$TASK" "${flags[@]}"
      # Root scripts (CI policy, agent identity) aren't a workspace package,
      # so Turbo doesn't see them; they're quick, so they always run.
      - name: Repo script tests
        if: matrix.task == 'test'
        run: pnpm test:scripts
      # Only the Lint leg saves the pnpm store: every job installs the same
      # lockfile, and a lockfile change always runs the code checks.
      - if: needs.plan.outputs.save_cache == 'true'
        uses: ./.github/actions/save-cache
        with:
          pnpm-store: ${{ matrix.task == 'lint' }}

  # The Next.js builds prerender from the database, so Build needs a migrated,
  # seeded Postgres. Turbo's strict env mode strips job env from tasks, so the
  # database settings reach the build (and db:migrate/db:seed, which load
  # ../.env) through a root .env file.
  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: findeg_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d findeg_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TURBO_FLAGS: ${{ needs.plan.outputs.turbo_flags }}
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ needs.plan.outputs.fetch_depth }}
      - uses: ./.github/actions/setup
        with:
          cache: ${{ needs.plan.outputs.use_cache }}
          turbo-cache-key: build
          next-cache: 'true'
      - name: Write root .env
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://ci:ci@localhost:5432/findeg_ci
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          NEXT_PUBLIC_SITE_URL=http://localhost:3000
          NODE_ENV=test
          EOF
      - name: Migrate and seed the database
        run: |
          pnpm --filter @findeg/db run db:migrate
          pnpm --filter @findeg/db run db:seed
      # --only: the Type check job already covers type-check, which build
      # otherwise depends on.
      - name: Workspace package build
        run: |
          read -ra flags <<< "$TURBO_FLAGS"
          pnpm exec turbo run build --only "${flags[@]}"
      - if: needs.plan.outputs.save_cache == 'true'
        uses: ./.github/actions/save-cache

  # The integration suite creates and migrates its own database on the
  # service; it needs no .env, migration or seed.
  integration:
    name: Integration tests
    needs: plan
    if: needs.plan.outputs.run_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: findeg
          POSTGRES_PASSWORD: findeg
          POSTGRES_DB: findeg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U findeg -d findeg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgres://findeg:findeg@localhost:5432/findeg
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache: ${{ needs.plan.outputs.use_cache }}
      - run: pnpm test:integration
      - if: needs.plan.outputs.save_cache == 'true'
        uses: ./.github/actions/save-cache

  # Strict E2E builds its own apps against a fresh database, without restoring
  # dependencies, Turbo, Next.js or Cypress caches.
  e2e:
    name: E2E
    needs: plan
    if: needs.plan.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: findeg_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d findeg_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache: 'false'
      # pnpm's allowBuilds disables Cypress's postinstall.
      - name: Install Cypress binary
        run: pnpm --filter @findeg/storefront exec cypress install
      - name: Write root .env
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://ci:ci@localhost:5432/findeg_e2e
          DB_SSL=false
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          NEXT_PUBLIC_SITE_URL=http://localhost:3000
          NODE_ENV=production
          JWT_SECRET=ci-e2e-jwt-secret-at-least-32-characters
          JWT_REFRESH_SECRET=ci-e2e-refresh-secret-at-least-32-characters
          GUEST_ACCESS_SECRET=ci-e2e-guest-secret-at-least-32-characters
          EOF
      - name: Migrate and seed the database
        run: |
          pnpm --filter @findeg/db run db:migrate
          pnpm --filter @findeg/db run db:seed
      - name: Build storefront and dashboard from scratch
        run: >-
          pnpm exec turbo run build --only --cache=local:
          --filter=@findeg/storefront --filter=@findeg/dashboard
      - name: Start apps and wait for HTTP readiness
        run: |
          pnpm --filter @findeg/storefront start > "$RUNNER_TEMP/storefront.log" 2>&1 &
          pnpm --filter @findeg/dashboard start > "$RUNNER_TEMP/dashboard.log" 2>&1 &
          curl --fail --silent --show-error --location --retry 60 --retry-delay 2 --retry-all-errors --max-time 10 http://localhost:3000/en > /dev/null
          curl --fail --silent --show-error --location --retry 60 --retry-delay 2 --retry-all-errors --max-time 10 http://localhost:3001/en > /dev/null
      # Run both suites even if the first fails; the final step fails the job
      # after collecting both results. CI OK requires this job's success.
      - name: Storefront Cypress suite
        id: storefront
        continue-on-error: true
        run: pnpm --filter @findeg/storefront e2e:run:ci
      - name: Dashboard Cypress suite
        id: dashboard
        continue-on-error: true
        run: pnpm --filter @findeg/dashboard e2e:run:ci
      - name: Upload E2E failure evidence
        if: failure() || steps.storefront.outcome == 'failure' || steps.dashboard.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-evidence
          path: |
            frontend/storefront/cypress/screenshots
            frontend/storefront/cypress/videos
            frontend/dashboard/cypress/screenshots
            frontend/dashboard/cypress/videos
            ${{ runner.temp }}/storefront.log
            ${{ runner.temp }}/dashboard.log
          if-no-files-found: warn
      - name: Require both Cypress suites to pass
        if: always()
        env:
          STOREFRONT_RESULT: ${{ steps.storefront.outcome }}
          DASHBOARD_RESULT: ${{ steps.dashboard.outcome }}
        run: |
          test "$STOREFRONT_RESULT" = success
          test "$DASHBOARD_RESULT" = success

  # The only check a ruleset needs to require. It always runs, so skipped jobs
  # can't leave it pending; the policy decides whether the results pass.
  ci-ok:
    name: CI OK
    needs: [plan, checks, build, integration, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci-policy
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Decide the verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
          TIER: ${{ needs.plan.outputs.tier }}
        run: node scripts/ci-policy/cli.mjs verdict --tier "$TIER" --needs "$NEEDS"
