name: CI jobs

# Every CI job, called by ci.yml. The plan job asks .github/scripts for the
# tier and which jobs run; the others only carry out that plan, and the Gate
# job turns their results into the one required check, `CI / Gate`.
#
#   strict  every job from scratch: Turbo --force, nothing restored, E2E required
#   fast    affected packages only, caches restored; develop pushes save the caches
#   manual  fast, unless the checkboxes skip caches or ask for the full suite
#
# The `github` context here is the caller's (its event, refs and SHAs).
# Concurrency is set by the caller only: here `github.workflow` would name the
# caller too, and a matching group would cancel or deadlock it.
on:
  workflow_call:
    inputs:
      no_cache:
        description: 'Manual runs only, ignore every cache (pnpm store, Turbo, Next.js) and force Turbo.'
        type: boolean
        default: false
      full_tests:
        description: 'Manual runs only, run the full suite (every package, plus E2E) instead of the touched packages.'
        type: boolean
        default: false
    secrets:
      SLACK_WEBHOOK_URL:
        description: 'Slack incoming webhook for the run-result card. Optional, without it no card is posted.'
        required: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # to find the PR a develop push merged
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      turbo_flags: ${{ steps.plan.outputs.turbo_flags }}
      fetch_depth: ${{ steps.plan.outputs.fetch_depth }}
      # What Turbo's --affected diffs against: the PR base, the previous push, or
      # (manual runs) the base the changed paths were taken from.
      scm_base: ${{ github.event.pull_request.base.sha || github.event.before || steps.changes.outputs.base_sha }}
      restore_deps: ${{ steps.plan.outputs.restore_deps }}
      restore_build: ${{ steps.plan.outputs.restore_build }}
      save_cache: ${{ steps.plan.outputs.save_cache }}
      run_checks: ${{ steps.plan.outputs.run_checks }}
      run_integration: ${{ steps.plan.outputs.run_integration }}
      run_e2e: ${{ steps.plan.outputs.run_e2e }}
    steps:
      - name: Check out the CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A manual run diffs against develop's merge-base, so it needs the history.
          # '0' is quoted: a bare 0 is falsy, so `&& 0 || 2` would always pick 2.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '2' }}
          # workflows: the policy tests check that every job feeds the Gate.
          sparse-checkout: |
            .github/scripts
            .github/config
            .github/workflows
      # A sparse checkout keeps the root files, so .nvmrc is there.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # A PR is checked out as its merge commit, whose first parent is the base
      # tip. A push is compared with the branch's previous tip. When that can't
      # be fetched (a new branch, a force-push), no list is written and the
      # plan runs every job.
      - name: List changed paths
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=HEAD^1
          if [ "$EVENT" = workflow_dispatch ]; then
            # On develop itself the merge-base is HEAD, so take what its latest commit touched.
            if [ "$GITHUB_REF_NAME" = develop ]; then base=$(git rev-parse HEAD^1 || true)
            else base=$(git merge-base origin/develop HEAD || true); fi
            [ -n "$base" ] && echo "base_sha=$base" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = push ]; then
            # The checkout keeps no credentials: this fetch works anonymously on a
            # public repo, and a failed fetch runs every job, the safe side.
            base="$BEFORE"
            git fetch --quiet --depth=1 origin "$BEFORE" || base=
          fi
          if [ -n "$base" ] && git diff --name-only --no-renames "$base" HEAD > "$RUNNER_TEMP/changed-paths.txt"; then
            echo "file=$RUNNER_TEMP/changed-paths.txt" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/changed-paths.txt"
          fi

      # The head branch of the PR a develop push merged, if any: the policy runs a
      # feature merge on the fast tier, and a direct push or a hotfix merge from
      # scratch. A failed lookup reads as a direct push, the safe side.
      - name: Find the merged pull request
        id: merged
        if: github.event_name == 'push' && github.ref_name == 'develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "develop")][0].head.ref // ""' || true)
          echo "head=$head" >> "$GITHUB_OUTPUT"

      # The policy's behaviour is pinned by its tests (next to each module under
      # .github/scripts); a regression fails here before the plan it would corrupt is used.
      - name: Test the CI policy
        run: node --test '.github/scripts/**/*.test.mjs'

      - name: Decide the CI plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ github.base_ref || github.ref_name }}
          HEAD: ${{ github.head_ref }}
          CHANGED_FILES: ${{ steps.changes.outputs.file }}
          NO_CACHE: ${{ inputs.no_cache }}
          FULL_TESTS: ${{ inputs.full_tests }}
          MERGED_HEAD: ${{ steps.merged.outputs.head }}
        run: >-
          node .github/scripts/ci-cli.mjs plan --event "$EVENT" --target "$TARGET"
          --head "$HEAD" --changed-files "$CHANGED_FILES"
          --no-cache "$NO_CACHE" --full-tests "$FULL_TESTS" --merged-head "$MERGED_HEAD"

  # Always inspect every tracked text blob, even for docs-only plans. No pnpm,
  # history, build cache or database is needed. A failure feeds CI / Gate.
  integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Reject tracked conflict markers
        run: node .github/scripts/check-conflict-markers.mjs

  # The code checks share one shape: a full-history checkout on the fast tier
  # (Turbo's --affected diffs against the PR base or the previous push), the
  # shared setup, one Turbo task, then a cache save on producer runs. Lint,
  # Type check and Unit tests are one job, a leg per task; Build adds a
  # database. TURBO_FLAGS is split into an array: it may hold several flags.
  checks:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Lint, task: lint }
          - { name: Type check, task: type-check }
          - { name: Unit tests, task: test }
    env:
      TURBO_FLAGS: ${{ needs.plan.outputs.turbo_flags }}
      TURBO_SCM_BASE: ${{ needs.plan.outputs.scm_base }}
      TURBO_SCM_HEAD: ${{ github.sha }}
      TASK: ${{ matrix.task }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ needs.plan.outputs.fetch_depth }}
      - name: Set up pnpm, Node and caches
        uses: ./.github/actions/setup
        with:
          restore-deps: ${{ needs.plan.outputs.restore_deps }}
          restore-build: ${{ needs.plan.outputs.restore_build }}
          turbo-cache-key: ${{ matrix.task }}
      - name: Workspace package ${{ matrix.task }}
        run: |
          read -ra flags <<< "$TURBO_FLAGS"
          pnpm exec turbo run "$TASK" "${flags[@]}"
      # Only the Lint leg saves the pnpm store: every job installs the same
      # lockfile, and a lockfile change always runs the code checks.
      - name: Save caches
        if: needs.plan.outputs.save_cache == 'true'
        uses: ./.github/actions/save-cache
        with:
          pnpm-store: ${{ matrix.task == 'lint' }}

  # The architecture standard's own tests (scripts/architecture): import
  # boundaries, client-bundle leaks and the lint ratchet, so a rule can't be
  # loosened or go quiet with every other check still green. Plain Node tests,
  # not a Turbo task, so there is no Turbo cache to restore or save.
  architecture:
    name: Architecture tests
    needs: plan
    if: needs.plan.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm, Node and caches
        uses: ./.github/actions/setup
        with:
          restore-deps: ${{ needs.plan.outputs.restore_deps }}
          restore-build: 'false'
      - name: Run the architecture tests
        run: pnpm test:architecture

  # The Next.js builds prerender from the database, so Build needs a migrated,
  # seeded Postgres. Turbo's strict env mode strips job env from tasks, so the
  # database settings reach the build (and db:migrate/db:seed, which load
  # ../.env) through a root .env file.
  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: findeg_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d findeg_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TURBO_FLAGS: ${{ needs.plan.outputs.turbo_flags }}
      TURBO_SCM_BASE: ${{ needs.plan.outputs.scm_base }}
      TURBO_SCM_HEAD: ${{ github.sha }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ needs.plan.outputs.fetch_depth }}
      - name: Set up pnpm, Node and caches
        uses: ./.github/actions/setup
        with:
          restore-deps: ${{ needs.plan.outputs.restore_deps }}
          restore-build: ${{ needs.plan.outputs.restore_build }}
          turbo-cache-key: build
          next-cache: 'true'
      - name: Write root .env
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://ci:ci@localhost:5432/findeg_ci
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          NEXT_PUBLIC_SITE_URL=http://localhost:3000
          NODE_ENV=test
          EOF
      - name: Migrate and seed the database
        run: |
          pnpm --filter @findeg/db run db:migrate
          pnpm --filter @findeg/db run db:seed
      # --only: the Type check job already covers type-check, which build
      # otherwise depends on.
      - name: Workspace package build
        run: |
          read -ra flags <<< "$TURBO_FLAGS"
          pnpm exec turbo run build --only "${flags[@]}"
      - name: Save caches
        if: needs.plan.outputs.save_cache == 'true'
        uses: ./.github/actions/save-cache

  # The integration suite creates and migrates its own database on the
  # service; it needs no .env, migration or seed.
  integration:
    name: Integration tests
    needs: plan
    if: needs.plan.outputs.run_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: findeg
          POSTGRES_PASSWORD: findeg
          POSTGRES_DB: findeg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U findeg -d findeg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgres://findeg:findeg@localhost:5432/findeg
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm, Node and caches
        uses: ./.github/actions/setup
        with:
          restore-deps: ${{ needs.plan.outputs.restore_deps }}
          restore-build: ${{ needs.plan.outputs.restore_build }}
      - name: Run the integration tests
        run: pnpm test:integration
      - name: Save caches
        if: needs.plan.outputs.save_cache == 'true'
        uses: ./.github/actions/save-cache

  # Strict E2E builds its own apps against a fresh database, without restoring
  # dependencies, Turbo, Next.js or Cypress caches.
  e2e:
    name: E2E
    needs: plan
    if: needs.plan.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      screenshot_mode: ${{ steps.report.outputs.screenshot_mode }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: findeg_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d findeg_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm, Node and caches
        uses: ./.github/actions/setup
        with:
          restore-deps: 'false'
          restore-build: 'false'
      # pnpm's allowBuilds disables Cypress's postinstall.
      - name: Install Cypress binary
        run: pnpm --filter @findeg/storefront exec cypress install
      - name: Write root .env
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://ci:ci@localhost:5432/findeg_e2e
          DB_SSL=false
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          NEXT_PUBLIC_SITE_URL=http://localhost:3000
          NODE_ENV=production
          JWT_SECRET=ci-e2e-jwt-secret-at-least-32-characters
          JWT_REFRESH_SECRET=ci-e2e-refresh-secret-at-least-32-characters
          GUEST_ACCESS_SECRET=ci-e2e-guest-secret-at-least-32-characters
          EOF
      - name: Migrate and seed the database
        run: |
          pnpm --filter @findeg/db run db:migrate
          pnpm --filter @findeg/db run db:seed
      - name: Build storefront and dashboard from scratch
        run: >-
          pnpm exec turbo run build --only --cache=local:
          --filter=@findeg/storefront --filter=@findeg/dashboard
      - name: Start apps and wait for HTTP readiness
        run: |
          pnpm --filter @findeg/storefront start > "$RUNNER_TEMP/storefront.log" 2>&1 &
          pnpm --filter @findeg/dashboard start > "$RUNNER_TEMP/dashboard.log" 2>&1 &
          curl --fail --silent --show-error --location --retry 60 --retry-delay 2 --retry-all-errors --max-time 10 http://localhost:3000/en > /dev/null
          curl --fail --silent --show-error --location --retry 60 --retry-delay 2 --retry-all-errors --max-time 10 http://localhost:3001/en > /dev/null
      # Run E2E suites across all packages implementing the test:e2e contract.
      # One suite at a time: each Cypress run starts its own Xvfb on display :99,
      # so parallel suites race for it ("Display :99 is already in use"), and
      # they share the seeded database. --continue runs every suite to collect
      # complete failure evidence; tee keeps the output for the report
      # (pipefail keeps the exit status).
      - name: Execute E2E test suites
        id: e2e
        continue-on-error: true
        shell: bash
        env:
          TEST_ARTIFACTS_DIR: ${{ runner.temp }}/artifacts
        run: pnpm test:e2e --continue --concurrency=1 2>&1 | tee "$RUNNER_TEMP/e2e-output.txt"
      - name: Upload E2E failure evidence
        if: failure() || steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure-evidence
          path: |
            ${{ runner.temp }}/artifacts
            ${{ runner.temp }}/*.log
          if-no-files-found: warn
      # Always renders, even when the run crashed before writing any evidence.
      - name: Report E2E results
        id: report
        if: always()
        env:
          OUTCOME: ${{ steps.e2e.outcome || 'skipped' }}
          # Only pushes and manual runs may publish screenshots; PRs never get a write token.
          CAN_WRITE: ${{ github.event_name != 'pull_request' && 'true' || '' }}
        run: |
          args=(--outcome "$OUTCOME"
            --output-file "$RUNNER_TEMP/e2e-output.txt"
            --storefront-log "$RUNNER_TEMP/storefront.log"
            --dashboard-log "$RUNNER_TEMP/dashboard.log"
            --evidence-dir "$RUNNER_TEMP/artifacts"
            --artifact-name e2e-failure-evidence)
          if [ -n "$CAN_WRITE" ]; then args+=(--can-write); fi
          node .github/scripts/ci-e2e-cli.mjs report "${args[@]}"
      - name: Require E2E test suites to pass
        if: always()
        run: test "${{ steps.e2e.outcome }}" = success

  # Opt-in (screenshot_mode "pages" in .github/config/settings.json): publishes
  # failure screenshots to the ci-evidence branch, served by GitHub Pages, so the
  # E2E report can embed them. Its own job so the E2E job, which runs the
  # branch's code, never holds a write token.
  publish-evidence:
    name: Publish evidence
    needs: e2e
    if: always() && needs.e2e.outputs.screenshot_mode == 'pages' && needs.e2e.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Download E2E failure evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-failure-evidence
          path: evidence
      - name: Publish screenshots and prune old runs
        env:
          RUN_ID: ${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          GH_TOKEN: ${{ github.token }}
          # Environment identity covers the `site` repo the script creates; `git config`
          # here would only set the checkout's.
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: .github/scripts/publish-evidence.sh evidence

  # The only check a ruleset needs to require. It always runs, so skipped jobs
  # can't leave it pending; the policy decides whether the results pass.
  gate:
    name: Gate
    needs: [plan, integrity, checks, architecture, build, integration, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Decide the verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
          TIER: ${{ needs.plan.outputs.tier }}
        run: node .github/scripts/ci-cli.mjs verdict --tier "$TIER" --needs "$NEEDS"

  # Posts the run-result card to Slack after a push to develop or main. The card
  # comes from .github/config/templates; without the webhook secret (forks, a
  # repo that hasn't set it up) the job skips quietly instead of failing.
  notify:
    name: Notify
    needs: [gate]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      GATE_RESULT: ${{ needs.gate.result }}
    # Every step is skipped without the webhook secret.
    steps:
      - name: Check out the CI scripts
        if: env.SLACK_WEBHOOK_URL != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/config
      - name: Set up Node
        if: env.SLACK_WEBHOOK_URL != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Post the run-result card
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          status=failure
          [ "$GATE_RESULT" = success ] && status=success
          node .github/scripts/ci-report-cli.mjs render \
            --template run-result.slack.json --status "$status" --env > "$RUNNER_TEMP/card.json"
          curl --fail --silent --show-error --retry 3 --max-time 20 \
            -H 'Content-Type: application/json' \
            --data @"$RUNNER_TEMP/card.json" "$SLACK_WEBHOOK_URL"
