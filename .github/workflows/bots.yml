name: Bots

# All automated bot integrations in one place. Four jobs:
#
#   queue-pr     — adds `review:queued` when a non-draft PR opens or becomes
#                  ready for review. Re-queues when a new push arrives.
#
#   review-mode  — sets the AUTO_REVIEW repo variable (claude | codex | off).
#                  Controls which agent auto-reviews newly opened PRs.
#                  Requires the AUTO_REVIEW_TOKEN secret (fine-grained PAT
#                  with Variables: read and write).
#
#   claude       — runs a Claude Code PR review. Triggered by:
#                    • AUTO_REVIEW == 'claude' on PR open/ready_for_review
#                    • label `review:claude` added to any PR
#                    • @claude mention in a comment or review (owner only)
#                    • workflow_dispatch
#                  Manages the full PR state label lifecycle.
#
#   codex-label  — the Codex GitHub app (chatgpt-codex-connector[bot]) reviews
#                  on its own with no workflow run. This job just updates state
#                  labels when Codex posts a comment or review.
#
# PR state labels (managed here, created on first use):
#   review:queued       — PR opened or updated; waiting for agent pick-up
#   review:in-progress  — an agent has claimed this PR (prevents double pick-up)
#   review:claude       — manual: request Claude specifically
#   review:codex        — manual: request Codex specifically
#   reviewed:claude     — Claude completed at least one review pass
#   reviewed:codex      — Codex completed at least one review pass

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'review-mode: change AUTO_REVIEW; claude: review a PR'
        required: true
        type: choice
        options: [review-mode, claude]
      mode:
        description: '[review-mode] Which bot auto-reviews new PRs'
        required: false
        type: choice
        options: [claude, codex, 'off']
      pr_number:
        description: '[claude] Pull Request number to review'
        required: false
        type: string
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, ready_for_review, synchronize, labeled]

env:
  GH_REPO: ${{ github.repository }}

# ── queue-pr ──────────────────────────────────────────────────────────────────
# Adds review:queued to every non-draft PR that opens, becomes ready, or gets a
# new push — so the label always reflects "has unreviewed changes".
jobs:
  queue-pr:
    name: Queue for review
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' ||
       github.event.action == 'ready_for_review' ||
       github.event.action == 'synchronize') &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Add review:queued label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          gh label create "review:queued" \
            --color "e4e669" \
            --description "Waiting for agent review" \
            --force

          # Only queue if no review is already in-progress or done on this push.
          LABELS=$(gh pr view "$PR_NUM" --json labels -q '.labels[].name' | tr '\n' ' ')
          if echo "$LABELS" | grep -qE 'review:in-progress'; then
            echo "Review already in progress, skipping re-queue."
          else
            gh pr edit "$PR_NUM" \
              --remove-label "reviewed:claude" 2>/dev/null || true
            gh pr edit "$PR_NUM" \
              --remove-label "reviewed:codex"  2>/dev/null || true
            gh pr edit "$PR_NUM" --add-label "review:queued"
          fi

  # ── review-mode ───────────────────────────────────────────────────────────────
  # Sets or shows the AUTO_REVIEW repo variable that the `claude` job reads.
  # Valid values: claude | codex | off (anything else is treated as off).
  review-mode:
    name: Review mode
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'review-mode') ||
      (github.event_name == 'issue_comment' &&
        github.actor == github.repository_owner &&
        !endsWith(github.actor, '[bot]') &&
        startsWith(github.event.comment.body, '/auto-review'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: auto-review-mode
      cancel-in-progress: false
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Apply mode
        env:
          GH_TOKEN: ${{ secrets.AUTO_REVIEW_TOKEN }}
          COMMENT_TOKEN: ${{ github.token }}
          CURRENT: ${{ vars.AUTO_REVIEW }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          TARGET_ID: ${{ github.event.issue.number }}
        run: |
          # Normalise legacy/unknown values to off.
          case "$CURRENT" in claude|codex) ;; *) CURRENT=off ;; esac

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="$INPUT_MODE"
          else
            MODE=$(printf '%s' "$COMMENT_BODY" | head -n1 | awk '{print tolower($2)}')
          fi

          reply() {
            if [ -n "$TARGET_ID" ]; then
              GH_TOKEN="$COMMENT_TOKEN" gh issue comment "$TARGET_ID" --body "$1"
            fi
            echo "$1"
          }

          case "$MODE" in
            "")
              reply "Auto review mode: \`$CURRENT\`. Use \`/auto-review claude|codex|off\` to change it."
              exit 0
              ;;
            claude|codex|off) ;;
            *)
              reply "Unknown mode \`$MODE\`. Use \`/auto-review claude|codex|off\`."
              exit 1
              ;;
          esac

          if [ -z "$GH_TOKEN" ]; then
            reply "Cannot set mode: the \`AUTO_REVIEW_TOKEN\` secret is missing (fine-grained PAT with Variables read/write)."
            exit 1
          fi

          gh variable set AUTO_REVIEW --repo "$GITHUB_REPOSITORY" --body "$MODE"
          reply "Auto review mode set to \`$MODE\` (was \`$CURRENT\`)."

  # ── claude ────────────────────────────────────────────────────────────────────
  # Runs a Claude Code PR review. Manages the full PR state label lifecycle:
  #   review:queued → review:in-progress → reviewed:claude (or back to queued on failure).
  claude:
    name: Claude review
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'claude') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'review:claude') ||
      (vars.AUTO_REVIEW == 'claude' &&
        github.event_name == 'pull_request' &&
        (github.event.action == 'opened' || github.event.action == 'ready_for_review') &&
        !github.event.pull_request.draft &&
        !contains(github.event.pull_request.labels.*.name, 'review:codex')) ||
      (github.actor == github.repository_owner && !endsWith(github.actor, '[bot]') && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', github.event.inputs.pr_number) || '' }}

      - name: Mark review in-progress
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number }}
        run: |
          [ -z "$PR_NUM" ] && exit 0
          # Ensure all state labels exist.
          gh label create "review:queued"       --color "e4e669" --description "Waiting for agent review"   --force
          gh label create "review:in-progress"  --color "d93f0b" --description "Agent review in progress"   --force
          gh label create "review:claude"       --color "a371f7" --description "Request Claude review"       --force
          gh label create "reviewed:claude"     --color "8250df" --description "Reviewed by Claude"          --force
          # Transition: queued → in-progress
          gh pr edit "$PR_NUM" --remove-label "review:queued"   2>/dev/null || true
          gh pr edit "$PR_NUM" --remove-label "review:claude"   2>/dev/null || true
          gh pr edit "$PR_NUM" --add-label    "review:in-progress"

      - name: Determine prompt
        id: prompt_step
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
          COMMENT_PR_NUM: ${{ github.event.issue.pull_request && github.event.issue.number || '' }}
        run: |
          echo "pr_num=${PR_NUM:-$COMMENT_PR_NUM}" >> "$GITHUB_OUTPUT"
          if [ -n "$PR_NUM" ]; then
            BASE=$(gh pr view "$PR_NUM" --json baseRefName -q .baseRefName)
            echo "prompt=Review PR #$PR_NUM against base origin/$BASE following .agents/skills/bot-pr-review/SKILL.md, then post the verdict with gh pr comment $PR_NUM." >> "$GITHUB_OUTPUT"
          else
            echo "prompt=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude Code
        id: claude
        # The review is advisory: a failed run (expired token, usage limit, outage)
        # is reported as a warning instead of failing the check.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt_step.outputs.prompt }}
          allowed_bots: ${{ vars.CLAUDE_PR_AUTHORS }},${{ vars.CODEX_PR_AUTHORS }}
          additional_permissions: |
            actions: read
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Skill,Bash(git diff:*),Bash(git log:*),Bash(git rev-parse:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"

      - name: Update PR state labels
        if: always() && steps.prompt_step.outputs.pr_num != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ steps.prompt_step.outputs.pr_num }}
          OUTCOME: ${{ steps.claude.outcome }}
        run: |
          gh pr edit "$PR_NUM" --remove-label "review:in-progress" 2>/dev/null || true
          if [ "$OUTCOME" = "success" ]; then
            gh pr edit "$PR_NUM" --add-label "reviewed:claude"
          else
            # Re-queue so the PR can be retried.
            gh pr edit "$PR_NUM" --add-label "review:queued"
          fi

      - name: Report Claude failure
        if: steps.claude.outcome == 'failure'
        run: |
          msg="Claude did not complete (non-blocking). Check that CLAUDE_CODE_OAUTH_TOKEN is valid and the account has not hit a usage limit."
          echo "::warning title=Claude review did not run::$msg"
          {
            echo "### ⚠️ Claude review did not run"
            echo
            echo "$msg"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── codex-trigger ─────────────────────────────────────────────────────────────
  # When AUTO_REVIEW == 'codex' or label 'review:codex' is added, trigger Codex
  # by posting an `@codex review` comment so the Codex GitHub App starts reviewing.
  codex-trigger:
    name: Codex trigger
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'review:codex') ||
      (vars.AUTO_REVIEW == 'codex' &&
        github.event_name == 'pull_request' &&
        (github.event.action == 'opened' || github.event.action == 'ready_for_review') &&
        !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Trigger Codex review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          gh label create "review:queued"       --color "e4e669" --description "Waiting for agent review"   --force
          gh label create "review:in-progress"  --color "d93f0b" --description "Agent review in progress"   --force
          gh label create "review:codex"        --color "2ea44f" --description "Request Codex review"       --force
          gh pr edit "$PR_NUM" --remove-label "review:queued" 2>/dev/null || true
          gh pr edit "$PR_NUM" --add-label "review:in-progress"
          gh pr comment "$PR_NUM" --body "@codex review"

  # ── codex-label ───────────────────────────────────────────────────────────────
  # The Codex GitHub app (chatgpt-codex-connector[bot]) reviews on its own — no
  # workflow run, no API key. This job only updates state labels when it posts.
  codex-label:
    name: Codex label
    if: >-
      github.actor == 'chatgpt-codex-connector[bot]' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Update PR state labels for Codex review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          gh label create "review:codex"   --color "2ea44f" --description "Request Codex review"  --force
          gh label create "reviewed:codex" --color "0e8a16" --description "Reviewed by Codex"      --force
          gh pr edit "$PR_NUM" --remove-label "review:queued"      2>/dev/null || true
          gh pr edit "$PR_NUM" --remove-label "review:in-progress" 2>/dev/null || true
          gh pr edit "$PR_NUM" --remove-label "review:codex"       2>/dev/null || true
          gh pr edit "$PR_NUM" --add-label    "reviewed:codex"
