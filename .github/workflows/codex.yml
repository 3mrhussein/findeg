name: Codex

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to review'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  codex:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'agent:claude') ||
      (vars.AUTO_AGENT_REVIEW == 'true' &&
        github.event_name == 'pull_request' &&
        (github.event.action == 'opened' || github.event.action == 'ready_for_review') &&
        !github.event.pull_request.draft &&
        contains(format(',{0},', vars.CLAUDE_PR_AUTHORS), format(',{0},', github.event.pull_request.user.login))) ||
      (github.actor == github.repository_owner && !endsWith(github.actor, '[bot]') && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@codex')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@codex')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@codex'))
      ))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare instructions
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUM="${{ github.event.inputs.pr_number }}"
            BASE=$(gh pr view "$PR_NUM" --json baseRefName -q .baseRefName)
            echo "Review PR #$PR_NUM against base origin/$BASE. Provide a clear, concise code review focusing on bugs, logic errors, and breaking changes. If ready to merge, approve with a brief note." > codex-prompt.txt
            echo "target_id=$PR_NUM" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
            BASE="${{ github.base_ref }}"
            echo "Review PR #$PR_NUM against base origin/$BASE. Provide a clear, concise code review focusing on bugs, logic errors, and breaking changes. If ready to merge, approve with a brief note." > codex-prompt.txt
            echo "target_id=$PR_NUM" >> $GITHUB_OUTPUT
          else
            TARGET_ID="${{ github.event.issue.number || github.event.pull_request.number }}"
            RAW="${{ github.event.comment.body || github.event.review.body }}"
            echo "$RAW" > codex-prompt.txt
            echo "target_id=$TARGET_ID" >> $GITHUB_OUTPUT
          fi

      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: codex-prompt.txt

      - name: Post Comment
        if: steps.run_codex.outputs.final-message != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ID: ${{ steps.prep.outputs.target_id }}
          MESSAGE: ${{ steps.run_codex.outputs.final-message }}
        run: |
          gh issue comment "$TARGET_ID" --body "$MESSAGE"
