name: Codex

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codex:
    if: |
      github.actor == github.repository_owner &&
      !endsWith(github.actor, '[bot]') && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@codex')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@codex')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@codex')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@codex') || contains(github.event.issue.title, '@codex')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare instructions
        id: prep
        run: |
          COMMENT_BODY="${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}"
          TARGET_ID="${{ github.event.issue.number || github.event.pull_request.number }}"
          IS_PR="${{ github.event.issue.pull_request != null || github.event.pull_request != null }}"

          cat << 'EOF' > codex-prompt.txt
          You are assisting in this repository. Follow the repository rules in AGENTS.md.
          EOF

          if [ "$IS_PR" = "true" ]; then
            echo "" >> codex-prompt.txt
            echo "Context: Pull Request #$TARGET_ID." >> codex-prompt.txt
            echo "Base branch: origin/${{ github.base_ref || 'main' }}." >> codex-prompt.txt
            echo "If asked to review, follow .agents/skills/code-review/SKILL.md and AGENTS.md (Standards and Spec)." >> codex-prompt.txt
          fi

          echo "" >> codex-prompt.txt
          echo "Instructions from user comment:" >> codex-prompt.txt
          echo "$COMMENT_BODY" >> codex-prompt.txt

      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: codex-prompt.txt

      - name: Post Comment
        if: steps.run_codex.outputs.final-message != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ID: ${{ github.event.issue.number || github.event.pull_request.number }}
          MESSAGE: ${{ steps.run_codex.outputs.final-message }}
        run: |
          gh issue comment "$TARGET_ID" --body "$MESSAGE"
