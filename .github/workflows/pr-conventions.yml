name: PR conventions

# Runs on every PR, whatever its base branch.
# Required checks (by job name, referenced in both branch rulesets):
#   `PR title`      — validates Conventional Commits format via amannn/action-semantic-pull-request
#   `Branch policy` — validates branch name and release source via .github/scripts
# Do NOT rename these jobs without updating the rulesets in Settings → Rules.
#
# `edited` also fires when the PR's base branch changes, so the branch policy
# is re-judged against the new base.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  # Same rules as the local pre-push hook: both call .github/scripts.
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      # A sparse checkout keeps the root files, so .nvmrc is there.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check branch name and release source
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: node .github/scripts/ci-cli.mjs branch-policy --head "$HEAD_REF" --base "$BASE_REF"
