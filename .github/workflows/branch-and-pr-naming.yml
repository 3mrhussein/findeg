name: Branch and PR naming

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: PR title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  branch-name:
    name: Branch name (<type>/<slug>)
    runs-on: ubuntu-latest
    steps:
      - name: Validate head branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Branches auto-generated by tooling (e.g. Claude Code worktrees) aren't
          # human-chosen task names, so they're exempt, mirroring
          # scripts/validate-branch-name.mjs's local pre-push check.
          if [[ "$HEAD_REF" == worktree-* ]]; then
            exit 0
          fi
          if ! [[ "$HEAD_REF" =~ ^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Branch \"$HEAD_REF\" doesn't match <type>/<kebab-case-slug> (types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert)."
            exit 1
          fi
