name: Codex app label

# The Codex GitHub app reviews on its own (no workflow run, no API key), so label its PRs here.

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

jobs:
  label:
    if: >-
      github.actor == 'chatgpt-codex-connector[bot]' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Mark PR as reviewed by Codex
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          gh label create "Codex Reviewed" --color 0e8a16 --description "Reviewed by the Codex bot" --force
          gh pr edit "$PR_NUM" --add-label "Codex Reviewed"
