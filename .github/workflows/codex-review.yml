# Has Codex review PRs that Claude Code opened, using the repo's code-review skill.
# Triggered manually via:
#  - "Run workflow" button in Actions tab (workflow_dispatch)
#  - Adding label `agent:claude` to the PR
#  - Automatically on PR open when repo variable AUTO_AGENT_REVIEW is 'true'
name: Codex review (Claude PRs)

on:
  pull_request:
    types: [opened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to review'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'agent:claude') ||
      (vars.AUTO_AGENT_REVIEW == 'true' &&
        (github.event.action == 'opened' || github.event.action == 'ready_for_review') &&
        !github.event.pull_request.draft &&
        contains(format(',{0},', vars.CLAUDE_PR_AUTHORS), format(',{0},', github.event.pull_request.user.login)))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR details
        id: pr_info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUM="${{ github.event.inputs.pr_number }}"
            BASE=$(gh pr view "$PR_NUM" --json baseRefName -q .baseRefName)
          else
            PR_NUM="${{ github.event.pull_request.number }}"
            BASE="${{ github.base_ref }}"
          fi
          echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT
          echo "base_ref=$BASE" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the skill diffs against the merge-base

      - name: Run Codex Review
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            Review PR #${{ steps.pr_info.outputs.pr_number }} against base origin/${{ steps.pr_info.outputs.base_ref }}.

            Provide a clear, concise code review. Focus on:
            - Logic errors, potential bugs, edge cases, and race conditions
            - Breaking database or API contract changes

            If the code looks good and ready to merge, approve with a brief note.
            Keep feedback actionable and concise without unnecessary boilerplate.
            This run is non-interactive: never edit files or push.

      - name: Post Review Comment
        if: steps.run_codex.outputs.final-message != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr_info.outputs.pr_number }}
          MESSAGE: ${{ steps.run_codex.outputs.final-message }}
        run: |
          gh pr comment "$PR_NUMBER" --body "$MESSAGE"
