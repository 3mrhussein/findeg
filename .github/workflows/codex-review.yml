# Has Codex review PRs that Claude Code opened, using the repo's code-review skill.
# Claude authenticates as its own GitHub App (docs/agents/agent-identity.md), so
# its PRs are authored by one of the logins in the CLAUDE_PR_AUTHORS repo
# variable (comma-separated, e.g. `findeg-claude[bot]`).
# Drafts are skipped; marking one ready for review triggers it. Adding the `agent:claude` label re-requests a review by hand.
name: Codex review (Claude PRs)

on:
  pull_request:
    types: [opened, ready_for_review, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  review:
    if: >-
      ((github.event.action == 'opened' || github.event.action == 'ready_for_review') &&
        !github.event.pull_request.draft &&
        contains(format(',{0},', vars.CLAUDE_PR_AUTHORS), format(',{0},', github.event.pull_request.user.login))) ||
      (github.event.action == 'labeled' && github.event.label.name == 'agent:claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the skill diffs against the merge-base

      - name: Run Codex Review
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }} by following
            .agents/skills/code-review/SKILL.md and ## Code Review Rules in AGENTS.md exactly.

            - Fixed point: origin/${{ github.base_ref }}.
            - Spec: the issue(s) this PR closes. Find them with
              `gh pr view ${{ github.event.pull_request.number }} --json closingIssuesReferences`,
              then read each one with `gh issue view`. If none, skip the Spec axis and say "no spec available".
            - Do both axes yourself in this session: run the Standards pass, then the Spec pass.
            - This run is non-interactive: never edit files or push.
            - Post the final report (## Standards, ## Spec, one-line summary) as a single comment.

      - name: Post Review Comment
        if: steps.run_codex.outputs.final-message != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MESSAGE: ${{ steps.run_codex.outputs.final-message }}
        run: |
          gh pr comment "$PR_NUMBER" --body "$MESSAGE"
