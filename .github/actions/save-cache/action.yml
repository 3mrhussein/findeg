name: Save caches
description: >-
  Save the caches ./.github/actions/setup restored, under the keys it computed.
  Call it last in a job, only when the plan's save_cache is true (a push to
  develop, the single cache producer). A key that already exists is skipped
  with a warning, never an error.

runs:
  using: composite
  steps:
    - name: Save pnpm store
      uses: actions/cache/save@v6
      with:
        path: ${{ env.CI_PNPM_STORE }}
        key: ${{ env.CI_PNPM_KEY }}

    - name: Save Turbo cache
      if: env.CI_TURBO_KEY != ''
      uses: actions/cache/save@v6
      with:
        path: .turbo/cache
        key: ${{ env.CI_TURBO_KEY }}

    - name: Save Next.js build cache
      if: env.CI_NEXT_KEY != ''
      uses: actions/cache/save@v6
      with:
        path: |
          frontend/storefront/.next/cache
          frontend/dashboard/.next/cache
        key: ${{ env.CI_NEXT_KEY }}
