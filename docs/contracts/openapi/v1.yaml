  /partner/{partnerId}/reports:
    parameters:
      - in: path
        name: partnerId
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: period
        required: true
        schema:
          type: string
          pattern: '^20[0-9]{2}-(0[1-9]|1[0-2])$'
    get:
      operationId: get_partner_report
      summary: Read a privacy-limited Partner Reward Statement
      description: >
        Requires a current active Partner Administrator or Report Viewer membership in the selected
        Business Partner. Balances are cumulative through the selected UTC month; sales rows only
        include paid Attributed Sales groups with at least three distinct Orders. Customer identity,
        contact and delivery data are never returned.
      security:
        - sessionCookie: []
      x-idempotency: Read only; safe to retry.
      responses:
        '200':
          description: Scoped Partner Reward Statement and privacy-limited sales breakdowns
          content:
            application/json:
              schema:
                type: object
                required: [status, report]
                properties:
                  status:
                    const: found
                  report:
                    type: object
                    required: [partnerId, period, statement, sales, suppressed]
                    properties:
                      partnerId:
                        type: integer
                      period:
                        type: string
                        pattern: '^20[0-9]{2}-(0[1-9]|1[0-2])$'
                      statement:
                        type: object
                        required: [points, value]
                        properties:
                          points:
                            $ref: '#/components/schemas/RewardStatementBalances'
                          value:
                            anyOf:
                              - $ref: '#/components/schemas/RewardStatementBalances'
                              - type: 'null'
                      sales:
                        type: array
                        items:
                          type: object
                          required: [day, listId, listItemId, variantId, count, subtotal]
                          properties:
                            day:
                              type: string
                            listId:
                              type: integer
                            listItemId:
                              type: integer
                            variantId:
                              type: integer
                            count:
                              type: integer
                              minimum: 3
                            subtotal:
                              type: string
                      suppressed:
                        type: boolean
        '400':
