openapi: 3.1.0
info:
  title: FindEg HTTP API
  version: 1.0.0
  description: >
    Canonical contract for versioned JSON adapters. Routes are added only when

    the corresponding authorized application operation exists.


    Only capabilities wired into the released web runtime are exposed. Partner Reward rates,
    acceptance entitlements, and privacy-limited Partner Reports are durable. Worker notification
    delivery is internal.

    JSON bodies use status for commerce/list outcomes and errorCode/message for session and
    management rejections. Unexpected server failures are not business rejections. Session
    credentials are opaque cookies, never a caller-supplied Current Session.
servers:
  - url: /api/v1
paths:
  /back-office/partners/{partnerId}/reward-rates:
    parameters:
      - in: path
        name: partnerId
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      operationId: post_back_office_partner_reward_rates
      summary: Configure an explicit Partner Points Rate and conversion rate
      description: Requires same-origin Origin and fresh finance.manage access. Rates are immutable historical business policy; missing configuration prevents list checkout. Points floor per discounted item subtotal excluding delivery, and reward value rounds half up to piasters.
      security:
        - sessionCookie: []
      x-idempotency: Caller and key identify a durable outcome. Identical canonical rates and partner replay; changed input conflicts. Authorization is checked before replay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, pointsPerEgp, egpPerPoint]
              properties:
                key:
                  type: string
                  pattern: '^[a-zA-Z0-9_-]{1,128}$'
                pointsPerEgp:
                  type: string
                  description: Positive points per EGP; at most 10 integer digits and 6 decimals.
                egpPerPoint:
                  type: string
                  description: Positive EGP per point; at most 8 integer digits and 4 decimals.
      responses:
        '201':
          description: Configured rate, including identical replay
          content:
            application/json:
              schema:
                type: object
                required: [status, rate]
                properties:
                  status:
                    const: configured
                  rate:
                    type: object
                    required: [id, businessPartnerId, pointsPerEgp, egpPerPoint]
                    properties:
                      id:
                        type: integer
                      businessPartnerId:
                        type: integer
                      pointsPerEgp:
                        type: string
                      egpPerPoint:
                        type: string
        '400':
          description: invalid-input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: authentication-required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: origin-denied or authorization-denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: partner-unavailable or idempotency-conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /back-office/partners/{partnerId}/reward-workflows:
    parameters:
      - in: path
        name: partnerId
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      operationId: post_back_office_partner_reward_workflow
      summary: Verify a settlement account or record a Partner Reward correction
      description: Requires same-origin Origin and fresh finance.manage access. The selected Business Partner must be active. `verify-bank-account` records Finance approval of an opaque partner-bound account identifier. A settlement accepts only that durable approval; corrections and settlements append immutable ledger events.
      security:
        - sessionCookie: []
      x-idempotency: Caller, action and key identify a durable outcome. Authorization is checked before an identical replay; changed input conflicts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, key]
              properties:
                action:
                  type: string
                  enum:
                    [verify-bank-account, refund, cancellation, reversal, adjustment, settlement]
                key:
                  type: string
                  pattern: '^[a-zA-Z0-9_-]{1,128}$'
                bankAccountId:
                  type: string
                orderReference:
                  type: string
                points:
                  type: integer
                reason:
                  type: string
                verifiedBankAccountId:
                  type: string
                settlementReference:
                  type: string
      responses:
        '201':
          description: Durable approval, correction, settlement, or identical replay
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [bank-account-verified, refunded, cancelled, reversed, recorded, settled]
        '400':
          description: invalid-input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: authentication-required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: origin-denied or authorization-denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: partner-unavailable, bank-account-unverified, reward-unavailable, or idempotency-conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /back-office/orders/{reference}:
    parameters:
      - in: path
        name: reference
        required: true
        schema:
          type: string
          pattern: '^[a-f0-9]{64}$'
    get:
      operationId: get_back_office_order_state
      summary: Read current delivery and payment state
      description: Requires fresh fulfillment.manage or finance.manage access. Accepted snapshots remain historical; this result is the current lifecycle projection.
      security:
        - sessionCookie: []
      x-idempotency: Read only; safe to retry.
      responses:
        '200':
          description: Current Order state
          content:
            application/json:
              schema:
                type: object
                required: [status, state]
                properties:
                  status:
                    const: found
                  state:
                    $ref: '#/components/schemas/OrderState'
        '400':
          description: invalid-input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: authentication-required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: authorization-denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not-found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: post_back_office_order_lifecycle
      summary: Confirm home delivery or record the full COD payment
      description: Requires same-origin Origin. Deliver requires fulfillment.manage; pay requires finance.manage. Payment follows successful delivery and amount must exactly equal the accepted total. No online payment or collection workflow.
      security:
        - sessionCookie: []
      x-idempotency: Caller, action and key identify a durable outcome. Identical reference and amount replay after fresh authorization; changed input conflicts. Different keys cannot repeat delivery, stock finalization, payment or earning.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, key]
              properties:
                action:
                  type: string
                  enum: [deliver, pay]
                key:
                  type: string
                  pattern: '^[a-zA-Z0-9_-]{1,128}$'
                amount:
                  $ref: '#/components/schemas/Money'
      responses:
        '200':
          description: Delivery or payment recorded, including identical replay
          content:
            application/json:
              schema:
                type: object
                required: [status, state]
                properties:
                  status:
                    type: string
                    enum: [delivered, paid]
                  state:
                    $ref: '#/components/schemas/OrderState'
        '400':
          description: invalid-input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: authentication-required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: authorization-denied or origin-denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not-found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: delivery-required, amount-mismatch, already-delivered, already-paid, reservation-unavailable or idempotency-conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sessions:
    post:
      summary: Authenticate an active User and issue an opaque session cookie
      description: Requires a same-origin Origin header. Replaces the browser's existing credential.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  maxLength: 255
                password:
                  type: string
                  minLength: 1
                  description: Maximum 72 UTF-8 bytes
      responses:
        '201':
          description: Authenticated; Set-Cookie supplies the HttpOnly credential
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - authenticated
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials or inactive User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: post_sessions
      x-idempotency: No idempotency key or guaranteed replay. Read current state before retrying an
        uncertain mutation.
    delete:
      summary: Revoke the browser credential and clear its cookie
      description: Requires a same-origin Origin header; idempotent for absent or revoked credentials.
      responses:
        '204':
          description: Signed out
        '403':
          description: Origin denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: delete_sessions
      x-idempotency: Repeated sign-out succeeds with 204.
  /sessions/{portal}:
    get:
      summary: Resolve a Current Session for the requested Active Portal
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: portal
          required: true
          schema:
            type: string
            enum:
              - storefront
              - back-office
              - partner
        - in: query
          name: businessPartnerId
          description:
            Explicit Business Partner context for Partner Workspace; omitted only for automatic
            single-membership entry or selection.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Authoritative Current Session; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - session
                properties:
                  status:
                    const: authenticated
                  session:
                    $ref: '#/components/schemas/CurrentSession'
        '400':
          description: Invalid selected Business Partner ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or missing credential; clears the cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authorization Denial; preserves the cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown portal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Multiple eligible memberships; choose from the returned choices array
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - choices
                properties:
                  status:
                    const: workspace-selection-required
                  choices:
                    type: array
                    items:
                      type: object
                      required:
                        - partner
                        - membership
                      properties:
                        partner:
                          $ref: '#/components/schemas/BusinessPartner'
                        membership:
                          $ref: '#/components/schemas/PartnerMembership'
      operationId: get_sessions_portal_
  /back-office/staff-access:
    put:
      summary: Replace an existing User's fixed staff roles and activity
      description:
        Requires same-origin Origin and staff-access.manage in Back Office. Authorization and
        writes share a transaction.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - roles
                - isActive
              properties:
                userId:
                  type: integer
                  minimum: 1
                roles:
                  type: array
                  items:
                    $ref: '#/components/schemas/StaffRole'
                isActive:
                  type: boolean
      responses:
        '200':
          description: Updated atomically
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - updated
        '400':
          description: Invalid input or unknown role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or authorization denied; preserves valid sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: put_back_office_staff_access
      x-idempotency: No idempotency key or guaranteed replay. Read current state before retrying an
        uncertain mutation.
  /partner/{partnerId}/access:
    parameters:
      - in: path
        name: partnerId
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      summary: Read scoped memberships, invitations, and access history
      description: Requires a Partner Administrator in this Business Partner. No token digests are returned.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Scoped access overview; no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessOverview'
        '400':
          description: Invalid partner ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authorization denied; preserves session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: get_partner_partnerId_access
    post:
      summary: Issue or revoke invitations or update a Partner Membership
      description:
        Requires same-origin Origin and Partner Administrator access in the selected Business
        Partner. Resending revokes any pending invitation for the normalized email.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - action
                    - email
                    - roles
                  properties:
                    action:
                      const: invite
                    email:
                      type: string
                      format: email
                      maxLength: 255
                    roles:
                      $ref: '#/components/schemas/PartnerRoles'
                - type: object
                  required:
                    - action
                    - invitationId
                  properties:
                    action:
                      const: revoke
                    invitationId:
                      type: integer
                      minimum: 1
                - type: object
                  required:
                    - action
                    - membershipId
                    - roles
                    - status
                  properties:
                    action:
                      const: membership
                    membershipId:
                      type: integer
                      minimum: 1
                    roles:
                      $ref: '#/components/schemas/PartnerRoles'
                    status:
                      type: string
                      enum:
                        - active
                        - suspended
                        - ended
      responses:
        '200':
          description: Membership updated or invitation revoked
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - updated
                      - revoked
        '201':
          description: Invitation issued; the raw token is returned once for recipient sharing
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - token
                properties:
                  status:
                    const: invited
                  token:
                    type: string
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or authorization denied; preserves session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Membership not in selected Business Partner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Last administrator, terminal lifecycle, unavailable partner or invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: post_partner_partnerId_access
      x-idempotency: No idempotency key or guaranteed replay. Read current state before retrying an
        uncertain mutation.
  /back-office/partners/{partnerId}/access:
    parameters:
      - in: path
        name: partnerId
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      summary: Read scoped memberships, invitations, and access history
      description: Requires staff-access.manage in Back Office; staff do not impersonate members.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Scoped access overview; no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessOverview'
        '400':
          description: Invalid partner ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authorization denied; preserves session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: get_back_office_partners_partnerId_access
    post:
      summary: Issue or revoke invitations or update a Partner Membership
      description:
        Requires same-origin Origin and staff-access.manage in Back Office. Supports initial
        onboarding invitations and equivalent audited access management.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - action
                    - email
                    - roles
                  properties:
                    action:
                      const: invite
                    email:
                      type: string
                      format: email
                      maxLength: 255
                    roles:
                      $ref: '#/components/schemas/PartnerRoles'
                - type: object
                  required:
                    - action
                    - invitationId
                  properties:
                    action:
                      const: revoke
                    invitationId:
                      type: integer
                      minimum: 1
                - type: object
                  required:
                    - action
                    - membershipId
                    - roles
                    - status
                  properties:
                    action:
                      const: membership
                    membershipId:
                      type: integer
                      minimum: 1
                    roles:
                      $ref: '#/components/schemas/PartnerRoles'
                    status:
                      type: string
                      enum:
                        - active
                        - suspended
                        - ended
      responses:
        '200':
          description: Membership updated or invitation revoked
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - updated
                      - revoked
        '201':
          description: Invitation issued; the raw token is returned once for recipient sharing
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - token
                properties:
                  status:
                    const: invited
                  token:
                    type: string
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or authorization denied; preserves session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Membership not in selected Business Partner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Last administrator, terminal lifecycle, unavailable partner or invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: post_back_office_partners_partnerId_access
      x-idempotency: No idempotency key or guaranteed replay. Read current state before retrying an
        uncertain mutation.
  /partner/invitations/accept:
    post:
      summary: Accept one single-use invitation as its verified email recipient
      description:
        Requires same-origin Origin and an authenticated active User. Membership creation,
        invitation consumption, and audit commit together.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 256
      responses:
        '200':
          description: Accepted; response contains the new membership
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - membership
                properties:
                  status:
                    const: accepted
                  membership:
                    $ref: '#/components/schemas/PartnerMembership'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Unavailable invitation or existing active/suspended membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: post_partner_invitations_accept
      x-idempotency: No idempotency key or guaranteed replay. Read current state before retrying an
        uncertain mutation.
  /back-office/partners:
    post:
      summary: Create an onboarding Business Partner for a Partner School
      description: Requires same-origin Origin and staff-access.manage in Back Office.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - nameEn
                - nameAr
              properties:
                code:
                  type: string
                  pattern: ^[a-z0-9-]{1,120}$
                nameEn:
                  type: string
                  minLength: 1
                  maxLength: 200
                nameAr:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        '201':
          description: Created; response contains the Business Partner and its ID
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - partner
                properties:
                  status:
                    const: created
                  partner:
                    $ref: '#/components/schemas/BusinessPartner'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or authorization denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Code unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: post_back_office_partners
      x-idempotency: No idempotency key or guaranteed replay. Read current state before retrying an
        uncertain mutation.
  /back-office/partners/{partnerId}/status:
    parameters:
      - in: path
        name: partnerId
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      summary: Change Business Partner lifecycle
      description:
        Requires same-origin Origin and staff-access.manage. Activation requires an active
        Partner Administrator; closed is terminal.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - active
                    - suspended
                    - closed
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - updated
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or authorization denied
          content:
