  /commerce/checkout:
    post:
      summary: Atomically accept a guest Cash-on-Delivery Order
      description: >
        Preserve the guest Cart cookie. Generate one key per logical checkout and retry the exact

        same body after a lost response. The key is scoped to this Cart owner; changed input
        conflicts.

        Acceptance atomically commits immutable Order prices, reservations, replay outcome and
        outbox

        records, then clears the Cart. Codes are never returned by checkout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutInput'
      responses:
        '201':
          description: Accepted or replayed original receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutReceipt'
        '400':
          description: Invalid JSON or input
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - invalid-input
        '409':
          description:
            reconfirmation-required, idempotency-conflict, empty-cart, delivery-unavailable,
            variant-unavailable or insufficient-stock
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - reconfirmation-required
                      - idempotency-conflict
                      - empty-cart
                      - delivery-unavailable
                      - variant-unavailable
                      - insufficient-stock
      operationId: post_commerce_checkout
      x-idempotency:
        Body key scoped to owner and operation (also list for List Selection); identical
        request replays original 201 receipt, changed input returns 409 idempotency-conflict.
        Preserve the owner cookie.
  /commerce/orders/access:
    post:
      summary: Retrieve an accepted Order using opaque reference plus one-time code
      description:
        Codes expire 15 minutes after acceptance. Successful verification consumes the code
        atomically. Delivery is an outbox integration owned by ticket 59.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reference
                - code
              properties:
                reference:
                  type: string
                  pattern: ^[a-f0-9]{32,128}$
                code:
                  type: string
                  pattern: ^\d{6}$
      responses:
        '200':
          description:
            verified status and immutable Order snapshot including items, totals, payment status
            and delivery address
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - order
                properties:
                  status:
                    const: verified
                  order:
                    $ref: '#/components/schemas/AcceptedOrder'
        '400':
          description:
            invalid-input or not-found; missing, incorrect, expired and used credentials do not
            reveal the Order
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - invalid-input
                      - not-found
      operationId: post_commerce_orders_access
      x-idempotency: One-time code is consumed on success; retry returns 400 not-found.
