  /partner/{partnerId}/school-supply-lists:
    parameters:
      - in: path
        name: partnerId
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      summary: Create, edit, publish, replace or clone a School Supply List
      description:
        Requires same-origin Origin and an active Partner Administrator or List Manager in the
        selected Business Partner. The application owns publication, immutability and
        default-variant rules.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - action
                    - input
                  properties:
                    action:
                      const: create
                    input:
                      $ref: '#/components/schemas/SchoolSupplyListInput'
                - type: object
                  required:
                    - action
                    - listId
                    - items
                  properties:
                    action:
                      const: replace
                    listId:
                      type: integer
                      minimum: 1
                    items:
                      type: array
                      minItems: 1
                      maxItems: 100
                      items:
                        $ref: '#/components/schemas/SchoolSupplyListItemInput'
                - type: object
                  required:
                    - action
                    - listId
                  properties:
                    action:
                      const: publish
                    listId:
                      type: integer
                      minimum: 1
                    replacesListId:
                      type: integer
                      minimum: 1
                - type: object
                  required:
                    - action
                    - listId
                  properties:
                    action:
                      const: clone
                    listId:
                      type: integer
                      minimum: 1
      responses:
        '200':
          description: Updated or published
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - status
                    properties:
                      status:
                        type: string
                        enum:
                          - updated
                  - type: object
                    required:
                      - status
                      - list
                    properties:
                      status:
                        const: published
                      list:
                        $ref: '#/components/schemas/SchoolSupplyList'
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - list
                properties:
                  status:
                    const: created
                  list:
                    $ref: '#/components/schemas/SchoolSupplyList'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or authorization denied; valid session preserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: List not found in selected Business Partner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: immutable, variant-unavailable, invalid-transition or replacement-unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: post_partner_partnerId_school_supply_lists
      x-idempotency: No idempotency key or guaranteed replay. Read current state before retrying an
        uncertain mutation.
