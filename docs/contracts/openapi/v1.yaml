        School Supply List selections are excluded.
      responses:
        '200':
          description: Quoted Cart with items and subtotal, or variant-unavailable or insufficient-stock
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - status
                      - quote
                    properties:
                      status:
                        const: quoted
                      quote:
                        $ref: '#/components/schemas/CartQuote'
                  - type: object
                    required:
                      - status
                    properties:
                      status:
                        type: string
                        enum:
                          - variant-unavailable
                          - insufficient-stock
      operationId: get_commerce_cart
    put:
      summary: Replace the ordinary Cart with currently eligible Product Variants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - items
              properties:
                items:
                  type: array
                  maxItems: 100
                  description: Unique variant IDs. An empty array clears the Cart.
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - variantId
                      - quantity
                    properties:
                      variantId:
                        type: integer
                        minimum: 1
                      quantity:
                        type: integer
                        minimum: 1
                        maximum: 999
      responses:
        '200':
          description:
            Quoted Cart with items and subtotal, or variant-unavailable or insufficient-stock;
            rejections preserve the previous Cart
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - status
                      - quote
                    properties:
                      status:
                        const: quoted
                      quote:
                        $ref: '#/components/schemas/CartQuote'
                  - type: object
                    required:
                      - status
                    properties:
                      status:
                        type: string
                        enum:
                          - variant-unavailable
                          - insufficient-stock
        '400':
          description: Invalid JSON or input
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - invalid-input
