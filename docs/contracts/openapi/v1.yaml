openapi: 3.1.0
info:
  title: FindEg HTTP API
  version: 1.0.0
  description: |
    Canonical contract for versioned JSON adapters. Routes are added only when
    the corresponding authorized application operation exists.
servers:
  - url: /api/v1
paths:
  /sessions:
    post:
      summary: Authenticate an active User and issue an opaque session cookie
      description: Requires a same-origin Origin header. Replaces the browser's existing credential.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, maxLength: 255 }
                password: { type: string, minLength: 1, description: Maximum 72 UTF-8 bytes }
      responses:
        '201':
          description: Authenticated; Set-Cookie supplies the HttpOnly credential
        '400': { description: Invalid request }
        '401': { description: Invalid credentials or inactive User }
        '403': { description: Origin denied }
    delete:
      summary: Revoke the browser credential and clear its cookie
      description: Requires a same-origin Origin header; idempotent for absent or revoked credentials.
      responses:
        '204': { description: Signed out }
        '403': { description: Origin denied }
  /sessions/{portal}:
    get:
      summary: Resolve a Current Session for the requested Active Portal
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: portal
          required: true
          schema: { type: string, enum: [storefront, back-office, partner] }
        - in: query
          name: businessPartnerId
          description: Explicit Business Partner context for Partner Workspace; omitted only for automatic single-membership entry or selection.
          schema: { type: integer, minimum: 1 }
      responses:
        '400': { description: Invalid selected Business Partner ID }
        '409':
          { description: Multiple eligible memberships; choose from the returned choices array }
        '200':
          description: Authoritative Current Session; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [status, session]
                properties:
                  status: { const: authenticated }
                  session: { $ref: '#/components/schemas/CurrentSession' }
        '401': { description: Invalid or missing credential; clears the cookie }
        '403': { description: Authorization Denial; preserves the cookie }
        '404': { description: Unknown portal }
  /back-office/staff-access:
    put:
      summary: Replace an existing User's fixed staff roles and activity
      description: Requires same-origin Origin and staff-access.manage in Back Office. Authorization and writes share a transaction.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, roles, isActive]
              properties:
                userId: { type: integer, minimum: 1 }
                roles:
                  type: array
                  items: { $ref: '#/components/schemas/StaffRole' }
                isActive: { type: boolean }
      responses:
        '200': { description: Updated atomically }
        '400': { description: Invalid input or unknown role }
        '401': { description: Authentication required }
        '403': { description: Origin or authorization denied; preserves valid sessions }
        '404': { description: User not found }
  /partner/{partnerId}/access:
    parameters: &partnerPath
      - in: path
        name: partnerId
        required: true
        schema: { type: integer, minimum: 1 }
    get: &accessRead
      summary: Read scoped memberships, invitations, and access history
      description: Requires a Partner Administrator in this Business Partner. No token digests are returned.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Scoped access overview; no-store }
        '400': { description: Invalid partner ID }
        '401': { description: Authentication required }
        '403': { description: Authorization denied; preserves session }
    post: &accessWrite
      summary: Issue or revoke invitations or update a Partner Membership
      description: Requires same-origin Origin and Partner Administrator access in the selected Business Partner. Resending revokes any pending invitation for the normalized email.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [action, email, roles]
                  properties:
                    action: { const: invite }
                    email: { type: string, format: email, maxLength: 255 }
                    roles: { $ref: '#/components/schemas/PartnerRoles' }
                - type: object
                  required: [action, invitationId]
                  properties:
                    action: { const: revoke }
                    invitationId: { type: integer, minimum: 1 }
                - type: object
                  required: [action, membershipId, roles, status]
                  properties:
                    action: { const: membership }
                    membershipId: { type: integer, minimum: 1 }
                    roles: { $ref: '#/components/schemas/PartnerRoles' }
                    status: { type: string, enum: [active, suspended, ended] }
      responses:
        '200': { description: Membership updated or invitation revoked }
        '201':
          description: Invitation issued; the raw token is returned once for recipient sharing
          content:
            application/json:
              schema:
                type: object
                required: [status, token]
                properties:
                  status: { const: invited }
                  token: { type: string }
        '400': { description: Invalid input }
        '401': { description: Authentication required }
        '403': { description: Origin or authorization denied; preserves session }
        '404': { description: Membership not in selected Business Partner }
        '409':
          { description: Last administrator, terminal lifecycle, unavailable partner or invitation }
  /back-office/partners/{partnerId}/access:
    parameters: *partnerPath
    get:
      <<: *accessRead
      description: Requires staff-access.manage in Back Office; staff do not impersonate members.
    post:
      <<: *accessWrite
      description: Requires same-origin Origin and staff-access.manage in Back Office. Supports initial onboarding invitations and equivalent audited access management.
  /partner/invitations/accept:
    post:
      summary: Accept one single-use invitation as its verified email recipient
      description: Requires same-origin Origin and an authenticated active User. Membership creation, invitation consumption, and audit commit together.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200': { description: Accepted; response contains the new membership }
        '400': { description: Invalid input }
        '401': { description: Authentication required }
        '403': { description: Origin denied }
        '409': { description: Unavailable invitation or existing active/suspended membership }
  /back-office/partners:
    post:
      summary: Create an onboarding Business Partner for a Partner School
      description: Requires same-origin Origin and staff-access.manage in Back Office.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, nameEn, nameAr]
              properties:
                code: { type: string, pattern: '^[a-z0-9-]{1,120}$' }
                nameEn: { type: string, minLength: 1, maxLength: 200 }
                nameAr: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '201': { description: Created; response contains the Business Partner and its ID }
        '400': { description: Invalid input }
        '401': { description: Authentication required }
        '403': { description: Origin or authorization denied }
        '409': { description: Code unavailable }
  /back-office/partners/{partnerId}/status:
    parameters: *partnerPath
    post:
      summary: Change Business Partner lifecycle
      description: Requires same-origin Origin and staff-access.manage. Activation requires an active Partner Administrator; closed is terminal.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, suspended, closed] }
      responses:
        '200': { description: Updated }
        '400': { description: Invalid input }
        '401': { description: Authentication required }
        '403': { description: Origin or authorization denied }
        '404': { description: Business Partner not found }
        '409': { description: Invalid transition or missing administrator }
  /catalog:
    get:
      summary: Browse active bilingual catalog variants
      parameters:
        - in: query
          name: locale
          required: true
          schema: { type: string, enum: [en, ar] }
      responses:
        '200':
          description: Active variants with available inventory
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, sku, name, label, price, available]
                  properties:
                    id: { type: integer }
                    sku: { type: string }
                    name: { type: string }
                    label: { type: string }
                    price: { type: string }
                    strikePrice: { type: string }
                    available: { type: integer }
        '400': { description: Invalid locale }
  /back-office/catalog/variants:
    get:
      summary: List Product Variants for Catalog Managers
      description: Requires same-origin Origin and catalog.manage permission.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Product Variants with bilingual labels and persisted pricing
        '401': { description: Authentication required }
        '403': { description: Origin or authorization denied }
    post:
      summary: Create an active Product Variant
      description: Requires same-origin Origin and catalog.manage permission.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, sku, variantKey, label, basePrice, isActive]
              properties:
                productId: { type: integer, minimum: 1 }
                sku: { type: string, minLength: 1 }
                variantKey: { type: string, minLength: 1 }
                label:
                  type: object
                  required: [en, ar]
                  properties:
                    en: { type: string, minLength: 1 }
                    ar: { type: string, minLength: 1 }
                basePrice: { type: string }
                strikePrice: { type: string }
                isActive: { type: boolean }
      responses:
        '201': { description: Created }
        '400': { description: Invalid input }
        '401': { description: Authentication required }
        '403': { description: Origin or authorization denied }
        '404': { description: Product not found }
    put:
      summary: Update an active Product Variant
      description: Requires same-origin Origin and catalog.manage permission.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, sku, variantKey, label, basePrice, isActive]
              properties:
                variantId: { type: integer, minimum: 1 }
                sku: { type: string, minLength: 1 }
                variantKey: { type: string, minLength: 1 }
                label:
                  type: object
                  required: [en, ar]
                  properties:
                    en: { type: string, minLength: 1 }
                    ar: { type: string, minLength: 1 }
                basePrice: { type: string }
                strikePrice: { type: string }
                isActive: { type: boolean }
      responses:
        '200': { description: Updated }
        '400': { description: Invalid input }
        '401': { description: Authentication required }
        '403': { description: Origin or authorization denied }
        '404': { description: Variant not found }
  /back-office/inventory/adjustments:
    post:
      summary: Adjust inventory on-hand balance
      description: Requires same-origin Origin and catalog.manage permission. Contested decrements fail closed if stock is insufficient.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, warehouseId, quantityDelta]
              properties:
                variantId: { type: integer, minimum: 1 }
                warehouseId: { type: integer, minimum: 1 }
                quantityDelta: { type: integer }
                notes: { type: string }
      responses:
        '200': { description: Adjusted }
        '400': { description: Invalid input }
        '401': { description: Authentication required }
        '403': { description: Origin or authorization denied }
        '404': { description: Variant or warehouse not found }
        '409': { description: Insufficient stock }
  /commerce/cart:
    get:
      summary: Read and authoritatively price the ordinary guest Cart
      description: Issues or replaces the HttpOnly findeg_guest_cart cookie. Preserve it across requests. School Supply List selections are excluded.
      responses:
        '200':
          {
            description: 'Quoted Cart with items and subtotal, or variant-unavailable or insufficient-stock',
          }
    put:
      summary: Replace the ordinary Cart with currently eligible Product Variants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 100
                  description: Unique variant IDs. An empty array clears the Cart.
                  items:
                    type: object
                    additionalProperties: false
                    required: [variantId, quantity]
                    properties:
                      variantId: { type: integer, minimum: 1 }
                      quantity: { type: integer, minimum: 1, maximum: 999 }
      responses:
        '200':
          {
            description: 'Quoted Cart with items and subtotal, or variant-unavailable or insufficient-stock; rejections preserve the previous Cart',
          }
        '400': { description: 'Invalid JSON or input' }
  /commerce/delivery-zones:
    get:
      summary: List active home-delivery zones with bilingual names and exact EGP fees
      responses:
        '200': { description: 'Available status and zones array of id, name and fee' }
  /commerce/checkout/quote:
    post:
      summary: Review current Cart prices and delivery fee before acceptance
      description: Preserve the guest Cart cookie. Quoted responses include items, subtotal, zone, total and confirmation; money is a decimal EGP string. Any changed terms require a new confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [zoneId]
              properties:
                zoneId: { type: integer, minimum: 1 }
      responses:
        '200':
          {
            description: 'quoted, empty-cart, delivery-unavailable, variant-unavailable or insufficient-stock',
          }
        '400': { description: 'Invalid input' }
  /commerce/checkout:
    post:
      summary: Atomically accept a guest Cash-on-Delivery Order
      description: |
        Preserve the guest Cart cookie. Generate one key per logical checkout and retry the exact
        same body after a lost response. The key is scoped to this Cart owner; changed input conflicts.
        Acceptance atomically commits immutable Order prices, reservations, replay outcome and outbox
        records, then clears the Cart. Codes are never returned by checkout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key, confirmation, address, paymentMethod, deliveryMethod]
              properties:
                key: { type: string, pattern: '^[a-zA-Z0-9_-]{16,128}$' }
                confirmation: { type: string, pattern: '^[a-f0-9]{64}$' }
                paymentMethod: { const: cash-on-delivery }
                deliveryMethod: { const: home-delivery }
                address:
                  type: object
                  additionalProperties: false
                  required: [name, email, phone, street, city, zoneId]
                  properties:
                    name: { type: string, minLength: 1, maxLength: 255 }
                    email: { type: string, format: email, maxLength: 255 }
                    phone: { type: string, pattern: '^(?:\+20|0)1[0125]\d{8}$' }
                    street: { type: string, minLength: 1, maxLength: 255 }
                    city: { type: string, minLength: 1, maxLength: 255 }
                    zoneId: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Accepted or replayed original receipt
          content:
            application/json:
              schema:
                type: object
                required: [status, reference, accessReference, total]
                properties:
                  status: { const: accepted }
                  reference: { type: string }
                  accessReference:
                    { type: string, description: Opaque reference; save for Guest Order Access }
                  total: { type: string, example: '20.30' }
        '400': { description: 'Invalid JSON or input' }
        '409':
          {
            description: 'reconfirmation-required, idempotency-conflict, empty-cart, delivery-unavailable, variant-unavailable or insufficient-stock',
          }
  /commerce/orders/access:
    post:
      summary: Retrieve an accepted Order using opaque reference plus one-time code
      description: Codes expire 15 minutes after acceptance. Successful verification consumes the code atomically. Delivery is an outbox integration owned by ticket 59.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference, code]
              properties:
                reference: { type: string, pattern: '^[a-f0-9]{32,128}$' }
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200':
          {
            description: 'verified status and immutable Order snapshot including items, totals, payment status and delivery address',
          }
        '400':
          {
            description: 'invalid-input or not-found; missing, incorrect, expired and used credentials do not reveal the Order',
          }
  /commerce/list-selections/{code}:
    parameters:
      - $ref: '#/components/parameters/ListCode'
    get:
      summary: Open or resume a dedicated List Selection from an unlisted code
      description: |
        Uses an authenticated Customer identity or the opaque findeg_list_selection HttpOnly
        browser cookie. Selections never merge with the Cart or another list. Reads refresh
        inactivity; after LIST_SELECTION_INACTIVITY_DAYS (30 by default), published lists
        start from required defaults. Archived/replaced lists remain view-only.
        Returns list, selection, options, offerBasisPoints and optional pricing. Options
        contain current prices, bilingual brands and attributes for explicit comparison.
        Missing eligible choices omit pricing and prevent checkout, while edits remain possible.
      responses:
        '200':
          description: Found list and independently persisted selection; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListSelectionView' }
        '400': { description: Invalid code }
        '404': { description: Unknown code or unpublished Draft }
    put:
      summary: Save explicit item choices and quantities for one list
      description: |
        Requires same-origin Origin. Each choice must reference an item in this list and its
        default or a matching Allowed Alternative. Exact Items cannot be substituted.
        Required quantities multiplied by setCount define advisory completeness only.
        Empty selections are saved but cannot checkout. Rejections preserve prior choices.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListSelection' }
      responses:
        '200': { description: Found list, saved selection, current options and pricing }
        '400': { description: Invalid JSON, code, duplicate item, set count or quantity }
        '403': { description: origin-denied }
        '404': { description: Unknown code or unpublished Draft }
        '409': { description: list-unavailable or selection-unavailable }
  /commerce/list-selections/{code}/quote:
    parameters:
      - $ref: '#/components/parameters/ListCode'
    post:
      summary: Review a dedicated List Selection checkout
      description: |
        Requires same-origin Origin. Revalidates list status, matching choices, offer schedule,
        prices, stock and delivery zone. Completeness is advisory. A List Offer applies to
        every selected item and quantity; line amounts round half up to a piaster and fees
        are not discounted. Retain confirmation for explicit acceptance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [zoneId]
              properties:
                zoneId: { type: integer, minimum: 1 }
      responses:
        '200':
          {
            description: quoted with items,
            subtotal,
            completeness,
            zone,
            total,
            listId,
            selection and confirmation,
          }
        '400': { description: Invalid input }
        '403': { description: origin-denied }
        '404': { description: Unknown list }
        '409':
          {
            description: list-unavailable,
            empty-selection,
            selection-unavailable,
            insufficient-stock or delivery-unavailable,
          }
  /commerce/list-selections/{code}/checkout:
    parameters:
      - $ref: '#/components/parameters/ListCode'
    post:
      summary: Accept a separate Cash-on-Delivery List Selection Order
      description: |
        Requires same-origin Origin and the same selection identity used to quote.
        Request fields and receipt match ordinary checkout; keys are scoped to this owner,
        list and operation. Retry the identical body after an uncertain response. Acceptance
        revalidates and atomically records immutable item attribution, prices, stock reservation,
        idempotency outcome and notification outbox, then clears only this selection.
        Changed prices, offers or selection require reconfirmation. Archived or replaced lists
        reject new acceptance; a saved successful outcome still replays.
      requestBody:
        $ref: '#/paths/~1commerce~1checkout/post/requestBody'
      responses:
        '201': { $ref: '#/paths/~1commerce~1checkout/post/responses/201' }
        '400': { description: Invalid input }
        '403': { description: origin-denied }
        '404': { description: Unknown list }
        '409':
          {
            description: reconfirmation-required,
            idempotency-conflict,
            list-unavailable,
            empty-selection,
            selection-unavailable,
            insufficient-stock or delivery-unavailable,
          }

components:
  parameters:
    ListCode:
      in: path
      name: code
      required: true
      schema: { type: string, pattern: '^[a-zA-Z0-9_-]{16,128}$' }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: findeg_session
  schemas:
    ListSelection:
      type: object
      additionalProperties: false
      required: [setCount, items]
      properties:
        setCount: { type: integer, minimum: 1, maximum: 999 }
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [listItemId, variantId, quantity]
            properties:
              listItemId: { type: integer, minimum: 1 }
              variantId: { type: integer, minimum: 1 }
              quantity: { type: integer, minimum: 1, maximum: 999 }
    ListSelectionView:
      type: object
      required: [status, list, selection, options, offerBasisPoints]
      properties:
        status: { const: found }
        list:
          {
            type: object,
            description: 'Immutable published list metadata and required/optional, exact-item, specification and default-variant facts; archived lists include replacedById when applicable.',
          }
        selection: { $ref: '#/components/schemas/ListSelection' }
        options:
          {
            type: array,
            items: { type: object },
            description: 'Per-item allowed active variants with sku, bilingual name/label/brand, price, categoryId and attributes.',
          }
        offerBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        pricing:
          {
            type: object,
            description: 'Items with immutable attribution, subtotal and advisory completeness; omitted when a saved choice is no longer eligible.',
          }
    ListAttribution:
      type: object
      required:
        [
          listId,
          businessPartnerId,
          listItemId,
          defaultVariantId,
          alternative,
          catalogUnitPrice,
          offerBasisPoints,
          discountAmount,
        ]
      properties:
        listId: { type: integer }
        businessPartnerId: { type: integer }
        listItemId: { type: integer }
        specification:
          {
            type: object,
            description: 'Frozen categoryId and explicitly required attribute values; absent only for historical lists without recorded specifications.',
          }
        defaultVariantId: { type: integer }
        alternative: { type: boolean }
        catalogUnitPrice: { type: string }
        offerBasisPoints: { type: integer }
        discountAmount:
          {
            type: string,
            description: 'Exact EGP discount on this line; lineTotal records paid merchandise.',
          }
    StaffRole:
      type: string
      enum: [access-administrator, catalog-manager, fulfillment-operator, finance-manager]
    CurrentSession:
      type: object
      required:
        [userId, email, emailVerified, activePortal, authorizationVersion, staffRoles, permissions]
      properties:
        userId: { type: integer }
        email: { type: string }
        emailVerified: { type: boolean }
        activePortal: { type: string, enum: [storefront, back-office, partner] }
        authorizationVersion: { type: integer }
        partner: { $ref: '#/components/schemas/PartnerContext' }
        staffRoles:
          type: array
          items: { $ref: '#/components/schemas/StaffRole' }
        permissions:
          type: array
          items:
            type: string
            enum:
              [
                back-office.enter,
                staff-access.manage,
                catalog.manage,
                fulfillment.manage,
                finance.manage,
              ]
    PartnerRoles:
      type: array
      minItems: 1
      items:
        type: string
        enum: [partner-administrator, list-manager, collection-staff, report-viewer]
    PartnerContext:
      type: object
      required: [businessPartnerId, membershipId, roles, authorizationVersion]
      properties:
        businessPartnerId: { type: integer }
        membershipId: { type: integer }
        roles: { $ref: '#/components/schemas/PartnerRoles' }
        authorizationVersion: { type: integer }
    Error:
      type: object
      required: [errorCode, message]
      properties:
        errorCode:
          type: string
        message:
          type: string
        details: {}
