# Build once, migrate, then start web and worker from the same immutable tag.
x-release: &release
  image: findeg:${RELEASE_REVISION:?Set RELEASE_REVISION to the full Git commit SHA}

services:
  web:
    <<: *release
    build:
      context: .
      dockerfile: Dockerfile.runtime
      args:
        RELEASE_REVISION: ${RELEASE_REVISION}
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
  worker:
    <<: *release
    command: ['node', 'runtime/dist/worker-main.js']
    environment:
      WORKER_HOST: '0.0.0.0'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
  migrate:
    <<: *release
    profiles: ['maintenance']
    command: ['node', 'runtime/dist/migrate-main.js']
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DB_SSL: ${DB_SSL:-false}
