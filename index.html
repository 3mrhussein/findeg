<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FindEg.com - Learning & Play</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-primary: 14 184 166;
        --color-primary-dark: 15 118 110;
        --color-secondary: 245 158 11;
        --color-secondary-dark: 180 83 9;

        --background: 255 255 255;
        --foreground: 17 24 39;
        --card: 255 255 255;
        --card-foreground: 17 24 39;
        --muted: 243 244 246;
        --muted-foreground: 107 114 128;
        --border: 229 231 235;
      }

      .dark {
        --color-primary: 20 184 166;
        --color-primary-dark: 45 212 191;
        --color-secondary: 251 191 36;
        --color-secondary-dark: 252 211 77;

        --background: 17 24 39;
        --foreground: 243 244 246;
        --card: 31 41 55;
        --card-foreground: 243 244 246;
        --muted: 55 65 81;
        --muted-foreground: 156 163 175;
        --border: 55 65 81;
      }

      /* Shadcn/ui animations */
      @keyframes accordion-down {
        from { height: 0; }
        to { height: var(--radix-accordion-content-height); }
      }
      @keyframes accordion-up {
        from { height: var(--radix-accordion-content-height); }
        to { height: 0; }
      }

      /* Infinite scroll animation */
      @keyframes scroll-x {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }
      .animate-scroll-x {
        animation: scroll-x 40s linear infinite;
      }
      
      @keyframes scroll-x-reverse {
        from { transform: translateX(-50%); }
        to { transform: translateX(0); }
      }
      .animate-scroll-x-reverse {
        animation: scroll-x-reverse 40s linear infinite;
      }

       .dark .animate-scroll-x img,
       .dark .animate-scroll-x-reverse img {
         filter: brightness(0) invert(1);
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Poppins', 'sans-serif'],
            },
            colors: {
              primary: {
                DEFAULT: 'rgb(var(--color-primary) / <alpha-value>)',
                dark: 'rgb(var(--color-primary-dark) / <alpha-value>)',
                foreground: 'hsl(var(--primary-foreground))'
              },
              secondary: {
                DEFAULT: 'rgb(var(--color-secondary) / <alpha-value>)',
                dark: 'rgb(var(--color-secondary-dark) / <alpha-value>)',
                foreground: 'hsl(var(--secondary-foreground))'
              },
              background: 'rgb(var(--background) / <alpha-value>)',
              foreground: 'rgb(var(--foreground) / <alpha-value>)',
              card: {
                DEFAULT: 'rgb(var(--card) / <alpha-value>)',
                foreground: 'rgb(var(--card-foreground) / <alpha-value>)'
              },
              muted: {
                DEFAULT: 'rgb(var(--muted) / <alpha-value>)',
                foreground: 'rgb(var(--muted-foreground) / <alpha-value>)'
              },
              border: 'rgb(var(--border) / <alpha-value>)',
            },
            keyframes: {
              "accordion-down": {
                from: { height: "0" },
                to: { height: "var(--radix-accordion-content-height)" },
              },
              "accordion-up": {
                from: { height: "var(--radix-accordion-content-height)" },
                to: { height: "0" },
              },
            },
            animation: {
              "accordion-down": "accordion-down 0.2s ease-out",
              "accordion-up": "accordion-up 0.2s ease-out",
            },
          }
        }
      }
    </script>

<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-background text-foreground transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
